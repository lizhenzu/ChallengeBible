<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도전!!! 성경말씀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e3a8a;
    --navy-soft:#3b4a7d;
    --ink:#222222;
    --grey:#8a8f99;
    --line:#d8dbe2;
    --bg-card:#f6f7f9;
    --teal:#3fc1b0;
    --white:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Noto Sans KR',-apple-system,sans-serif;
    background:#e9ebef;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .phone{
    width:100%;
    max-width:420px;
    background:var(--white);
    min-height:100vh;
    position:relative;
    padding-bottom:40px;
  }
  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 6px;
  }
  .topbar .icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;}
  .topbar .right{display:flex;gap:6px;}
  svg{stroke:var(--navy-soft);}
  /* ---------- logo ---------- */
  .logo{
    text-align:center;
    padding:10px 0 4px;
  }
  .logo .kr{
    font-size:32px;
    font-weight:900;
    color:var(--navy);
    letter-spacing:1px;
    white-space:nowrap;
  }
  .logo .kr .accent{
    color:#0179dc;
  }
  .logo .tagline{
    font-size:14px;
    font-weight:500;
    color:var(--navy-soft);
    letter-spacing:1px;
    margin-top:8px;
  }
  /* ---------- search ---------- */
  .search-wrap{
    padding:16px 20px 8px;
  }
  .search-box{
    display:flex;
    align-items:center;
    border:2px solid var(--navy);
    border-radius:999px;
    padding:14px 20px;
    justify-content:space-between;
  }
  .search-box input{
    border:none;outline:none;flex:1;
    font-size:15px;color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
  }
  .search-box input::placeholder{color:#9aa0aa;}
  /* ---------- icon grid ---------- */
  .menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px 14px;
    padding:24px 40px 10px;
  }
  .menu-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    cursor:pointer;
  }
  .menu-tile{
    width:70px;height:70px;
    background:var(--white);
    border:1px solid #eceef2;
    border-radius:18px;
    box-shadow:0 2px 6px rgba(30,58,138,.06);
    display:flex;align-items:center;justify-content:center;
  }
  .menu-item span{
    font-size:13px;
    font-weight:500;
    color:var(--ink);
    text-align:center;
    line-height:1.35;
    word-break:keep-all;
  }
  /* ---------- daily verse ---------- */
  .verse-card{
    margin:18px 20px;
    background:#f6f7fb;
    border:1px solid #eceef2;
    border-radius:14px;
    padding:18px 20px 20px;
  }
  .verse-card h2{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:17px;
    font-weight:900;
    color:var(--ink);
    margin-bottom:14px;
  }
  .verse-card h2::before{
    content:"";
    width:4px;height:16px;
    background:var(--navy);
    border-radius:2px;
  }
  .verse-body{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .verse-body .book-icon{flex-shrink:0;}
  .verse-text{
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    line-height:1.65;
  }
  .verse-text .ref{
    color:var(--navy-soft);
    font-weight:700;
  }
  /* ---------- participation status ---------- */
  .status-card{
    margin:24px 20px 0;
    background:#f6f7fb;
    border:1px solid #eceef2;
    border-radius:14px;
    padding:18px 18px 20px;
  }
  .status-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .status-head h2{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:17px;
    font-weight:900;
    color:var(--ink);
  }
  .status-head h2 .trophy{
    width:22px;height:22px;flex-shrink:0;
  }
  .status-head h2::before{
    content:"";
    width:4px;height:16px;
    background:var(--navy);
    border-radius:2px;
  }
  .more-btn{
    font-size:12px;
    color:var(--grey);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
    display:flex;align-items:center;gap:3px;
  }
  .status-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
  }
  .status-row.detail{
    margin-top:16px;
    grid-template-columns:repeat(2,1fr);
  }
  .stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    text-align:center;
    padding:0 4px;
  }
  .stat + .stat{border-left:1px solid var(--line);}
  .stat .label{
    display:flex;align-items:center;gap:3px;
    font-size:10.5px;
    color:var(--grey);
    white-space:nowrap;
  }
  .stat .value{
    font-size:16px;
    font-weight:700;
    color:var(--navy-soft);
  }
</style>
</head>
<body>
<div class="phone">

  <!-- top bar -->
  <div class="topbar">
    <button class="icon-btn" aria-label="메뉴">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="right">
      <button class="icon-btn" aria-label="검색">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" aria-label="프로필">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
    </div>
  </div>

  <!-- logo -->
  <div class="logo">
    <div class="kr">도전!!! <span class="accent">성경말씀</span></div>
    <div class="tagline">하루 5분, 말씀과 함께 자라요.</div>
  </div>

  <!-- search -->
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" placeholder="성경 속 궁금한 단어 검색">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
  </div>

  <!-- icon menu -->
  <div class="menu-grid">
    <div class="menu-item">
      <div class="menu-tile">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V7.5z"/><path d="M14 3v4.5h4.5"/><path d="M9 13.5l2 2 4-4.5"/><path d="M8 18h8"/></svg>
      </div><span>도전!!!<br>성경미션</span>
    </div>
    <div class="menu-item">
      <div class="menu-tile">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H14l3.5 3.5V19.5A1.5 1.5 0 0 1 16 21H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M14 3v3.5h3.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
      </div><span>도전!!!<br>성경통독</span>
    </div>
    <div class="menu-item">
      <div class="menu-tile">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 4.5l3 3L9 18l-4 1 1-4z"/><path d="M14.5 6.5l3 3"/><path d="M4 21h16"/></svg>
      </div><span>도전!!!<br>성경필사</span>
    </div>
    <div class="menu-item">
      <div class="menu-tile">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/><path d="M12 10.5v4M10 12.5h4"/></svg>
      </div><span>자녀을 위한<br>기도365</span>
    </div>
  </div>

  <!-- daily verse -->
  <div class="verse-card">
    <h2>오늘의 말씀</h2>
    <div class="verse-body">
      <svg class="book-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.2 5 7.6 4.5 5 4.5v13c2.6 0 5.2.5 7 2 1.8-1.5 4.4-2 7-2v-13c-2.6 0-5.2.5-7 2z"/><path d="M12 6.5v13"/><path d="M14.5 4.5v6l1.8-1.4 1.7 1.4v-6"/></svg>
      <p class="verse-text">
        "너희는 마음에 근심하지 말라 하나님을 믿으니<br>
        또 나를 믿으라" <span class="ref">(요한복음 14:1)</span>
      </p>
    </div>
  </div>

  <!-- participation status -->
  <div class="status-card">
    <div class="status-head">
      <h2>
        <svg class="trophy" viewBox="0 0 24 24" fill="none" stroke="#f2b01e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 5M17 6h3a3 3 0 0 1-3 5"/><path d="M12 14v3M8.5 20h7"/></svg>
        나의 도전 현황
      </h2>
      <button class="more-btn">더보기
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="status-row">
      <div class="stat">
        <div class="label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--navy-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.5-3.7-2-6-2v14c2.3 0 4.5.5 6 2 1.5-1.5 3.7-2 6-2V4c-2.3 0-4.5.5-6 2z"/><path d="M12 6v14"/></svg>
          오늘의 참여 현황
        </div>
        <div class="value">1회</div>
      </div>
      <div class="stat">
        <div class="label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--navy-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
          이번 주 참여
        </div>
        <div class="value">3회</div>
      </div>
      <div class="stat">
        <div class="label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--navy-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/><path d="M16 8.5h5M18.5 6v5"/></svg>
          전체 참여자
        </div>
        <div class="value">248명</div>
      </div>
    </div>
    <div class="status-row detail">
      <div class="stat">
        <div class="label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#f2b01e" stroke="#f2b01e" stroke-width="1" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/></svg>
          나의 포인트
        </div>
        <div class="value">1,250점</div>
      </div>
      <div class="stat">
        <div class="label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f2b01e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 5M17 6h3a3 3 0 0 1-3 5"/><path d="M12 14v3M8.5 20h7"/></svg>
          이번 달 순위
        </div>
        <div class="value">12위</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
