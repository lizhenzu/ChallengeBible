<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF"><title>도전!!! 성경말씀</title>
<style>
html,body{margin:0;height:100%;background:#fff}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
img{width:150px;height:150px;display:block}
.dots{display:flex;gap:14px;margin-top:26px;height:22px;align-items:center}
.dots i{display:block;width:16px;height:16px;border-radius:50%;opacity:.2;animation:b 1.2s ease-in-out infinite}
.dots i:nth-child(1){background:#22b35e}.dots i:nth-child(2){background:#3b7cf0;animation-delay:.4s}.dots i:nth-child(3){background:#e8458f;animation-delay:.8s}
@keyframes b{0%,100%{opacity:.2;transform:none}12%,30%{opacity:1;transform:scale(1.35)}45%{opacity:.2;transform:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
</style></head>
<body><main aria-label="불러오는 중"><img src="/icons/clover.svg" alt=""><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></main>
<script>location.replace('/?s=1');</script>
</body></html>
