<title>통독 북마크 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap">
<style>
  /* 레이아웃(Bible2 북마크 구성): 위쪽 줄(☰ · 홈으로 · 성경통독 / 날짜) → 마음에 담은 말씀 · 북마크 제목 → 정렬(최근 담은 순 · 성경 순서) → 구절 목록(★ 빼기 · 본문으로) / 비었을 때 안내 */
  :root {
    --bg: #FFFFFF; --band: #F5F6F8; --fg: #1B1F24; --dim: #5B6470; --rule: #E3E6EA; --line: #C9CED5;
    --accent: #2B59C3; --on-accent: #FFFFFF; --tint: #E8EEFA; --tint-fg: #2B59C3; --chip: #F5F6F8; --star: #E0A100; --star-bg: #FFF6DA;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15181C; --band: #1C2026; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #6E95F0; --on-accent: #0E1013; --tint: #22304A; --tint-fg: #9DB7F5; --chip: #1E2329; --star: #F2BE3A; --star-bg: #33290F; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #15181C; --band: #1C2026; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #6E95F0; --on-accent: #0E1013; --tint: #22304A; --tint-fg: #9DB7F5; --chip: #1E2329; --star: #F2BE3A; --star-bg: #33290F; color-scheme: dark }

  html, body { background: var(--bg); }
  body { color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .gut { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 760px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  .k { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--accent); }

  .band { background: var(--band); }
  .band .wrap { padding-block: 12px 22px; display: flex; flex-direction: column; gap: 12px; }
  .bar1 { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .sq { flex: none; width: 44px; height: 40px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); display: grid; place-items: center; }
  .crumb { flex: 1; min-width: 0; font-size: 14px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb a { color: var(--fg); font-weight: 700; }
  .date { flex: none; font-size: 13px; color: var(--dim); }
  h1 { margin: 0; font-size: 30px; font-weight: 500; display: flex; align-items: baseline; gap: 10px; }
  h1 small { font-size: 18px; font-weight: 300; color: var(--dim); }
  .sub { margin: -4px 0 0; font-size: 13px; color: var(--dim); }

  main .wrap { padding-block: 18px 56px; display: flex; flex-direction: column; gap: 14px; }
  .tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .seg { display: inline-grid; grid-auto-flow: column; border-radius: 10px; background: var(--chip); padding: 3px; }
  .seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; font-weight: 700; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .tr { font-size: 13px; color: var(--dim); }
  .grp { margin: 10px 0 0; font-size: 13px; font-weight: 700; color: var(--dim); padding-bottom: 6px; border-bottom: 1px solid var(--fg); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .list .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .list .ref { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .list .ref a { font-size: 15px; font-weight: 800; color: var(--accent); }
  .list .ref small { font-size: 12px; color: var(--dim); }
  .list p { margin: 0; font-size: 17px; line-height: 1.9; word-break: keep-all; }
  .list .go { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--dim); min-height: 32px; display: inline-flex; align-items: center; }
  .st { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--star-bg); color: var(--star); display: grid; place-items: center; }
  .empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px; text-align: center; }
  .empty .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--star-bg); color: var(--star); display: grid; place-items: center; }
  .empty b { font-size: 18px; }
  .empty span { color: var(--dim); font-size: 14px; line-height: 1.7; }
  .empty a { margin-top: 6px; min-height: 48px; padding: 0 20px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; font-weight: 700; }
  .demo { font-size: 12px; color: var(--dim); text-align: center; }
  .demo button { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 12px; text-decoration: underline; min-height: 32px; }

  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(17,20,26,.45); }
  .drawer { position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--band); display: flex; flex-direction: column; padding: calc(8px + env(safe-area-inset-top, 0px)) 0 calc(18px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); overflow-y: auto; }
  .dh { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; min-height: 52px; }
  .dh b { font-size: 16px; font-weight: 800; color: var(--accent); }
  .dh button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; }
  .menu a { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; font-size: 15px; }
  .menu a[aria-current] { background: var(--bg); font-weight: 800; }
  .menu a[aria-current]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .menu a small { margin-left: auto; font-size: 12px; color: var(--dim); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 12px; background: var(--fg); color: var(--bg); padding: 10px 10px 10px 18px; border-radius: 14px; font-weight: 700; white-space: nowrap; max-width: calc(100vw - 40px); }
  .toast button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--bg); color: var(--fg); font-weight: 800; }
  .toast.plain { padding-right: 18px; }
</style>

<div class="band gut"><div class="wrap">
  <div class="bar1">
    <button type="button" class="sq" id="openMenu" aria-label="목차 열기" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="crumb"><a href="https://claude.ai/artifact/NPStHNG39PrnSZJvrcWH11">홈으로</a> · <a href="https://claude.ai/artifact/EKDPu67xqjtGoJdyybFnrC">성경통독</a></span>
    <span class="date">1월 5일 화요일</span>
  </div>
  <span class="k">마음에 담은 말씀</span>
  <h1>북마크 <small class="num" id="cnt"></small></h1>
  <p class="sub">성경말씀 · 성경통독 어디서 ★ 을 눌러도 여기에 모여요. 학년이 바뀌어도 그대로예요.</p>
</div></div>

<main class="gut"><div class="wrap">
  <div class="tools" id="tools">
    <div class="seg" role="group" aria-label="정렬">
      <button type="button" data-s="recent" aria-pressed="true">최근 담은 순</button>
      <button type="button" data-s="bible" aria-pressed="false">성경 순서</button>
    </div>
    <span class="tr">개역개정</span>
  </div>
  <div id="out"></div>
  <p class="demo">시안 전용: <button type="button" id="demoEmpty">비었을 때 보기</button> · <button type="button" id="demoFill">처음 4개로</button></p>
</div></main>

<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="성경 통독 목차" hidden>
  <div class="dh"><b>도전!!!성경통독</b><button type="button" id="closeMenu" aria-label="목차 닫기">×</button></div>
  <div class="menu">
    <a href="https://claude.ai/artifact/EKDPu67xqjtGoJdyybFnrC">대시보드</a>
    <a href="https://claude.ai/artifact/XouqXnmrRwpMfJYNiQCqa6">구약 읽기<small class="num">23 / 929</small></a>
    <a href="https://claude.ai/artifact/XouqXnmrRwpMfJYNiQCqa6#nt">신약 읽기<small class="num">0 / 260</small></a>
    <a href="https://claude.ai/artifact/9iyY7mxb1GBdbmbbnC2Sji">성경 검색</a>
    <a href="#" aria-current="page">북마크<small class="num" id="mCnt"></small></a>
    <a href="https://claude.ai/artifact/AoTMzQqYcdFb2hcuueTuTN">참여자 현황</a>
  </div>
</nav>

<script>
  const $ = (id) => document.getElementById(id);
  const READ_URL = 'https://claude.ai/artifact/2WtQWyBgeUqbx6R9a8bzLZ';
  const ORDER = ['창세기', '시편'];
  // [책, 장, 절, 담은 날, 어디서, 본문(개역개정)]
  const START = [
    ['창세기', 24, 2, '오늘 07:40', '성경통독', '아브라함이 자기 집 모든 소유를 맡은 늙은 종에게 이르되 청하건대 네 손을 내 허벅지 밑에 넣으라'],
    ['창세기', 12, 2, '1월 2일', '성경통독', '내가 너로 큰 민족을 이루고 네게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라'],
    ['창세기', 1, 1, '1월 1일', '성경통독', '태초에 하나님이 천지를 창조하시니라'],
    ['시편', 23, 1, '12월 28일', '성경말씀 · 성경 읽기', '여호와는 나의 목자시니 내게 부족함이 없으리로다'],
  ];
  let B = START.slice(), sort = 'recent';
  const star = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>';

  let tt;
  function toast(t, undo) {
    document.querySelectorAll('.toast').forEach((x) => x.remove()); clearTimeout(tt);
    const el = document.createElement('div'); el.className = 'toast' + (undo ? '' : ' plain'); el.setAttribute('role', 'status');
    el.innerHTML = `<span>${t}</span>`;
    if (undo) { const b = document.createElement('button'); b.type = 'button'; b.textContent = '되돌리기'; b.onclick = () => { undo(); el.remove(); }; el.appendChild(b); }
    document.body.appendChild(el); tt = setTimeout(() => el.remove(), 4000);
  }
  const ref = (v) => `${v[0]} ${v[1]}:${v[2]}`;
  const item = (v) => `<li><div class="body"><div class="ref"><a href="${v[0] === '창세기' && v[1] === 24 ? READ_URL : '#x'}" data-r="${v[0]} ${v[1]}장">${ref(v)}</a><small>${v[3]} · ${v[4]}</small></div><p>${v[5]}</p><a class="go" href="${v[0] === '창세기' && v[1] === 24 ? READ_URL : '#x'}" data-r="${v[0]} ${v[1]}장">본문으로 →</a></div><button type="button" class="st" data-k="${ref(v)}" aria-label="${ref(v)} 북마크 빼기">${star}</button></li>`;

  function draw() {
    $('cnt').textContent = B.length ? B.length + '절' : ''; $('mCnt').textContent = B.length || '';
    $('tools').hidden = !B.length;
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.s === sort));
    if (!B.length) {
      $('out').innerHTML = `<div class="empty"><span class="ic">${star}</span><b>아직 담은 말씀이 없어요</b><span>성경을 읽다가 절 끝 ★ 을 누르면<br>여기에 모아 둘게요</span><a href="https://claude.ai/artifact/EKDPu67xqjtGoJdyybFnrC">성경 읽으러 가기</a></div>`;
      return;
    }
    if (sort === 'recent') { $('out').innerHTML = `<ul class="list">${B.map(item).join('')}</ul>`; return; }
    const sorted = B.slice().sort((a, b) => ORDER.indexOf(a[0]) - ORDER.indexOf(b[0]) || a[1] - b[1] || a[2] - b[2]);
    $('out').innerHTML = ORDER.filter((bk) => sorted.some((v) => v[0] === bk)).map((bk) => `<h2 class="grp">${bk}</h2><ul class="list">${sorted.filter((v) => v[0] === bk).map(item).join('')}</ul>`).join('');
  }
  $('out').addEventListener('click', (e) => {
    const s = e.target.closest('.st');
    if (s) {
      const i = B.findIndex((v) => ref(v) === s.dataset.k), v = B[i];
      B.splice(i, 1); draw();
      toast(`${ref(v)} 북마크를 뺐어요`, () => { B.splice(i, 0, v); draw(); });
      return;
    }
    const a = e.target.closest('a[href="#x"]');
    if (a) { e.preventDefault(); toast(`${a.dataset.r} 본문으로 가요 (시안에서는 창세기 24장만 열려요)`); }
  });
  document.querySelector('.seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { sort = b.dataset.s; draw(); } });
  $('demoEmpty').onclick = () => { B = []; draw(); };
  $('demoFill').onclick = () => { B = START.slice(); draw(); };

  function menu(open) { $('drawer').hidden = $('scrim').hidden = !open; $('openMenu').setAttribute('aria-expanded', open); if (open) $('closeMenu').focus(); }
  $('openMenu').onclick = () => menu(true);
  $('closeMenu').onclick = $('scrim').onclick = () => menu(false);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('drawer').hidden) menu(false); });
  document.querySelector('.menu a[aria-current]').addEventListener('click', (e) => { e.preventDefault(); menu(false); });
  document.querySelectorAll('.menu a[href="#x"]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); menu(false); toast(`${a.firstChild.textContent} 화면으로 가요 (다음 시안)`); }));
  draw();
</script>
