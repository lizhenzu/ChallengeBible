<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#E9ECF1;font-family:"Noto Sans KR",sans-serif;color:#111827}

.m b{font-size:14px}.m b em{font-style:normal;font-size:11.5px;color:#6B7280;font-weight:700;margin-left:4px}.m span{font-size:12.5px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{text-align:center;font-size:12.5px;color:#6B7280}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:8px}.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;font-weight:900;font-size:15px}.p{background:#2563EB;color:#fff}.s{background:#fff;border:1px solid #CBD5E1}
.chk{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12.5px;color:#6B7280}.chk span{width:16px;height:16px;border:2px solid #9CA3AF;border-radius:4px}
.bc{display:inline-block;margin-left:4px;padding:0 6px;border-radius:99px;background:#7C3AED;color:#fff;font-size:10.5px;font-weight:900;vertical-align:1px}
.later{display:grid;gap:6px;padding-top:4px;border-top:1px solid #E5E7EB}.later small{text-align:center;font-size:12.5px;color:#6B7280;font-weight:700}
.later div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.later div.q4{grid-template-columns:repeat(4,minmax(0,1fr))}.one{display:grid}.later span{height:38px;border:1px solid #D1D5DB;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#374151;background:#fff}
.tst{background:#111827;color:#fff;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;text-align:center}
