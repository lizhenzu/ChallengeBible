<style>
.rs-grp{border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rs-grp h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rs-grp h2 label{font-size:13px;font-weight:700;color:var(--dim);display:flex;gap:6px;align-items:center}
.rs-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.rs-list{grid-template-columns:minmax(0,1fr)}}
.rs-it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);min-width:0;font-size:14.5px}
.rs-it input{width:20px;height:20px;flex:none;accent-color:var(--bad,#C0392B)}
.rs-it span{flex:1;min-width:0}
.rs-it b.num{font-size:14px;color:var(--fg)}
.rs-it.lock{background:transparent;border:1px dashed var(--rule);color:var(--dim)}
.rs-it.lock i{font-style:normal;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft)}
.rs-it.off{opacity:.55}
.rs-note{margin:0;font-size:13px;color:var(--dim)}
.rs-go{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--bad-bg,#FDECEA)}
.rs-go label{display:flex;flex-direction:column;gap:4px;font-size:13px;flex:1;min-width:180px}
.rs-go .btn{background:var(--bad,#C0392B);color:#fff;border:0}
.rs-sum{margin:0;font-weight:800;font-size:14px}
.cap{font:700 12px/1 sans-serif;color:#7A3EE8;margin:0}
</style></head><body>
