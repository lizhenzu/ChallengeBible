<title>부서 정보 수정 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  /* 레이아웃(/platform/tenants): 플랫폼-부서관리 시안에 "기본 정보" 고치기를 더한 것. 줄을 펼치면 맨 앞에 기본 정보(부서 이름 · 시간대 · 대표 색, 주소는 읽기만) → 프로그램 · 참여 코드 · 관리자 */
  :root {
    --bg: #FFFFFF; --soft: #F5F6F8; --fg: #1B1F24; --dim: #5B6470; --rule: #E3E6EA; --line: #C9CED5;
    --accent: #2B59C3; --accent-bg: #EAF0FB; --on-accent: #FFFFFF; --ok: #16A34A; --ok-bg: #EAF7EF; --warn: #9A5B00; --warn-bg: #FFF4DE; --bad: #B42318; --bad-bg: #FDECEC;
    --plat: #1B1F24; --on-plat: #FFFFFF;
    --c-blue: #2B59C3; --c-green: #1F7A5C; --c-red: #B2462E; --c-violet: #6A4BB5;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #14171B; --soft: #1B1F25; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #7FA2F2; --accent-bg: #1C2740; --on-accent: #0E1013; --ok: #5CC98A; --ok-bg: #1B2A22; --warn: #F2C063; --warn-bg: #2E2614; --bad: #F5A3A6; --bad-bg: #2E1B1C;
    --plat: #E8EAED; --on-plat: #14171B;
    --c-blue: #7FA2F2; --c-green: #5CC0A0; --c-red: #F09A80; --c-violet: #B39BF0; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #14171B; --soft: #1B1F25; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #7FA2F2; --accent-bg: #1C2740; --on-accent: #0E1013; --ok: #5CC98A; --ok-bg: #1B2A22; --warn: #F2C063; --warn-bg: #2E2614; --bad: #F5A3A6; --bad-bg: #2E1B1C;
    --plat: #E8EAED; --on-plat: #14171B;
    --c-blue: #7FA2F2; --c-green: #5CC0A0; --c-red: #F09A80; --c-violet: #B39BF0; color-scheme: dark }

  html, body { background: var(--bg); }
  body { color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
  .hd .t { display: flex; align-items: center; gap: 10px; }
  .hd .t b { font-size: 17px; font-weight: 900; }
  .hd .t b em { font-style: normal; color: var(--accent); }
  .pl { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: var(--plat); color: var(--on-plat); }
  .me { font-size: 13px; color: var(--dim); }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
  nav.tabs a { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 700; color: var(--dim); border-bottom: 3px solid transparent; }
  nav.tabs a[aria-current] { color: var(--fg); border-color: var(--plat); }

  main .wrap { padding-block: 20px 56px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; }
  h1 small { font-size: 14px; font-weight: 500; color: var(--dim); margin-left: 6px; }
  .note { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 13.5px; font-weight: 700; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
  .btn.p { border-color: var(--plat); background: var(--plat); color: var(--on-plat); }
  .btn.l { border: 0; padding: 0 6px; color: var(--accent); }

  .list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 18px; overflow: hidden; }
  .line { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 28px; gap: 12px; align-items: center; padding: 0 16px; min-height: 64px; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--rule); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
  .nm b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm small { font-size: 12px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; }
  .tag { font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--ok-bg); color: var(--ok); white-space: nowrap; }
  .chev { font-size: 18px; color: var(--dim); transition: transform .15s; text-align: center; }
  .row.open .chev { transform: rotate(90deg); }

  .ed { display: none; padding: 4px 16px 18px 44px; flex-direction: column; gap: 16px; }
  .row.open .ed { display: flex; }
  @media (max-width: 760px) { .ed { padding-left: 16px; } }
  .ed h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 700; }
  .ed h3 span { font-weight: 500; }
  .basic { border: 1px solid var(--accent); background: var(--accent-bg); border-radius: 14px; padding: 14px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .basic h3 { grid-column: 1 / -1; margin: 0; color: var(--accent); }
  .f label.l { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .f .in { width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15px; }
  .f .in[aria-invalid="true"] { border-color: var(--bad); }
  .f .ro { min-height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 12px; background: var(--soft); font-family: ui-monospace, Consolas, monospace; font-size: 14px; color: var(--dim); }
  .colors { display: flex; gap: 10px; min-height: 44px; align-items: center; }
  .colors label { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; position: relative; }
  .colors input { position: absolute; opacity: 0; }
  .colors label:has(input:checked) { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--fg); }
  .hint { margin: 4px 0 0; font-size: 12.5px; color: var(--dim); }
  .hint.bad { color: var(--bad); font-weight: 700; }
  .hint.warn { color: var(--warn); font-weight: 700; }
  .basic .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rest { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); font-size: 14px; color: var(--dim); }
  .rest b { color: var(--fg); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; max-width: calc(100vw - 32px); box-sizing: border-box; }
</style>

<header class="gut">
  <div class="wrap hd">
    <div class="t"><b><em>도전!!!</em></b><span class="pl">플랫폼</span></div>
    <span class="me">운영자 · 플랫폼 관리자</span>
  </div>
  <nav class="wrap tabs" aria-label="플랫폼 메뉴">
    <a href="#x">플랫폼 홈</a><a href="#x" aria-current="page">부서</a><a href="#x">공용 콘텐츠</a><a href="#x">성경 데이터</a><a href="#x">기본 규칙</a><a href="#x">계정 찾기</a>
  </nav>
</header>

<main class="gut"><div class="wrap">
  <h1>부서 <small class="num" id="cnt"></small></h1>
  <p class="note">시안: 부서 줄을 펼치면 맨 위에 "기본 정보"가 생겨요. 나머지(프로그램 · 참여 코드 · 관리자 · 정지)는 지금 화면 그대로예요.</p>
  <ul class="list" id="list"></ul>
</div></main>

<script>
  const $ = (id) => document.getElementById(id);
  const TZ = [['Asia/Seoul', '한국 (Asia/Seoul)'], ['America/Los_Angeles', '미국 서부 (America/Los_Angeles)'], ['America/New_York', '미국 동부 (America/New_York)']];
  const COLORS = [['blue', '파랑'], ['green', '초록'], ['red', '주황'], ['violet', '보라']];
  // 잠실새내교회 말고는 지어낸 예시
  let T = [
    { id: 3, name: '잠실새내교회 초등부', slug: 'jamsil-saenae-elementary', c: 'green', tz: 'Asia/Seoul', at: '2026-11-02' },
    { id: 4, name: '잠실새내교회 중등부', slug: 'jamsil-saenae-middleschool', c: 'violet', tz: 'Asia/Seoul', at: '2026-12-28' },
    { id: 5, name: '잠실새내교회 고등부', slug: 'jamsil-saenae-highschool', c: 'blue', tz: 'Asia/Seoul', at: '2026-12-28' },
  ];
  let open = 3;
  function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

  function editor(t) {
    return `<div class="ed">
      <form class="basic" data-basic novalidate>
        <h3>기본 정보</h3>
        <div class="f"><label class="l" for="n${t.id}">부서 이름</label>
          <input class="in" id="n${t.id}" data-name value="${t.name}" maxlength="100"><p class="hint" data-nameh>참여 신청 목록 · 부서 고르기에 보이는 이름이에요.</p></div>
        <div class="f"><label class="l">주소</label><div class="ro">/${t.slug}</div><p class="hint">만든 뒤에는 바꿀 수 없어요(0048).</p></div>
        <div class="f"><label class="l" for="z${t.id}">시간대</label>
          <select class="in" id="z${t.id}" data-tz>${TZ.map(([v, l]) => `<option value="${v}" ${t.tz === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <p class="hint" data-tzh>"오늘"을 정하는 기준이에요.</p></div>
        <div class="f"><label class="l">대표 색</label>
          <div class="colors" role="radiogroup" aria-label="대표 색">${COLORS.map(([v, l]) => `<label style="background:var(--c-${v})"><input type="radio" name="c${t.id}" value="${v}" ${t.c === v ? 'checked' : ''} aria-label="${l}"></label>`).join('')}</div></div>
        <div class="acts"><button type="submit" class="btn p">기본 정보 저장</button><span class="hint" style="margin:0">서비스 이름(앱 이름)은 부서 관리자가 "이름 · 색" 화면에서 바꿔요.</span></div>
      </form>
      <div class="rest">
        <div><h3>프로그램 · 참여 코드 · 목록에 보이기</h3>지금 화면 그대로</div>
        <div><h3>부서 관리자 · 정지</h3>지금 화면 그대로</div>
        <div><h3>정보</h3>만든 날 <b class="num">${t.at.replace(/-/g, '.')}</b></div>
      </div></div>`;
  }
  function draw() {
    $('cnt').textContent = `${T.length}곳 운영 중`;
    $('list').innerHTML = T.map((t) => `<li class="row${open === t.id ? ' open' : ''}" data-id="${t.id}">
      <div class="line" data-open role="button" tabindex="0" aria-expanded="${open === t.id}">
        <span class="dot" style="background:var(--c-${t.c})"></span>
        <span class="nm"><b>${t.name}</b><small>/${t.slug}</small></span>
        <span class="tag">운영</span><span class="chev" aria-hidden="true">›</span></div>${editor(t)}</li>`).join('');
  }
  $('list').addEventListener('click', (e) => {
    const row = e.target.closest('.row'); if (!row || !e.target.closest('[data-open]')) return;
    const id = +row.dataset.id; open = open === id ? null : id; draw();
  });
  $('list').addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open]')) { e.preventDefault(); e.target.click(); } });
  $('list').addEventListener('change', (e) => {
    if (!e.target.matches('[data-tz]')) return;
    const row = e.target.closest('.row'), t = T.find((x) => x.id === +row.dataset.id), h = row.querySelector('[data-tzh]');
    const changed = e.target.value !== t.tz;
    h.textContent = changed ? '바꾸면 이 부서의 "오늘"과 미션 날짜가 바뀌는 시각이 달라져요. 이미 남긴 기록은 그대로예요.' : '"오늘"을 정하는 기준이에요.';
    h.className = changed ? 'hint warn' : 'hint';
  });
  $('list').addEventListener('submit', (e) => {
    e.preventDefault();
    const row = e.target.closest('.row'), t = T.find((x) => x.id === +row.dataset.id);
    const inp = row.querySelector('[data-name]'), h = row.querySelector('[data-nameh]'), name = inp.value.trim();
    if (!name) { h.textContent = '부서 이름을 1 ~ 100자로 써 주세요.'; h.className = 'hint bad'; inp.setAttribute('aria-invalid', 'true'); return inp.focus(); }
    t.name = name; t.tz = row.querySelector('[data-tz]').value; t.c = row.querySelector(`input[name=c${t.id}]:checked`).value;
    draw(); toast('기본 정보를 저장했어요.');
  });
  document.querySelectorAll('a[href="#x"]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
  draw();
</script>
