<title>공용 콘텐츠 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  /* 레이아웃(/platform/content/{kind}?month=, R-120 ~ R-124): 플랫폼 머리말 · 메뉴 → 종류 탭(말씀 · 퀴즈 · 기도 · 암송) → 달 이동 · 상태 합계 · 날짜 만들기 · 한꺼번에 공개 → 날짜 목록 | 편집(종류별 칸) + 아이 화면 미리보기 → 초안 저장 · 공개 */
  :root {
    --bg: #FFFFFF; --soft: #F5F6F8; --fg: #1B1F24; --dim: #5B6470; --rule: #E3E6EA; --line: #C9CED5;
    --accent: #2B59C3; --accent-bg: #EAF0FB; --on-accent: #FFFFFF; --ok: #16A34A; --ok-bg: #EAF7EF; --warn: #9A5B00; --warn-bg: #FFF4DE; --bad: #B42318; --bad-bg: #FDECEC;
    --plat: #1B1F24; --on-plat: #FFFFFF;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #14171B; --soft: #1B1F25; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #7FA2F2; --accent-bg: #1C2740; --on-accent: #0E1013; --ok: #5CC98A; --ok-bg: #1B2A22; --warn: #F2C063; --warn-bg: #2E2614; --bad: #F5A3A6; --bad-bg: #2E1B1C;
    --plat: #E8EAED; --on-plat: #14171B; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #14171B; --soft: #1B1F25; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #7FA2F2; --accent-bg: #1C2740; --on-accent: #0E1013; --ok: #5CC98A; --ok-bg: #1B2A22; --warn: #F2C063; --warn-bg: #2E2614; --bad: #F5A3A6; --bad-bg: #2E1B1C;
    --plat: #E8EAED; --on-plat: #14171B; color-scheme: dark }

  html, body { background: var(--bg); }
  body { color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .gut { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
  .hd .t { display: flex; align-items: center; gap: 10px; }
  .hd .t b { font-size: 17px; font-weight: 900; }
  .hd .t b em { font-style: normal; color: var(--accent); }
  .pl { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: var(--plat); color: var(--on-plat); }
  .me { font-size: 13px; color: var(--dim); }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
  nav.tabs a { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 700; color: var(--dim); border-bottom: 3px solid transparent; }
  nav.tabs a[aria-current] { color: var(--fg); border-color: var(--plat); }

  main .wrap { padding-block: 20px 56px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; }
  .kinds { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--soft); align-self: flex-start; max-width: 100%; overflow-x: auto; }
  .kinds button { flex: none; min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: none; font-size: 15px; font-weight: 800; color: var(--dim); }
  .kinds button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mon { display: flex; align-items: center; gap: 4px; }
  .mon b { font-size: 17px; font-weight: 900; min-width: 104px; text-align: center; }
  .mon button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 17px; }
  .cnt { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
  .cnt span { padding: 3px 10px; border-radius: 99px; font-weight: 800; }
  .st-pub { background: var(--ok-bg); color: var(--ok); }
  .st-draft { background: var(--warn-bg); color: var(--warn); }
  .st-none { background: var(--bad-bg); color: var(--bad); }
  .bar .sp { flex: 1; }
  .btn { min-height: 42px; padding: 0 14px; border-radius: 11px; font-size: 14px; font-weight: 800; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
  .btn.p { border-color: var(--plat); background: var(--plat); color: var(--on-plat); }
  .btn.a { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) { .split { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } .days { position: sticky; top: 130px; max-height: calc(100vh - 150px); overflow-y: auto; } }
  .days { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; }
  @media (max-width: 899px) { .days { max-height: 340px; overflow-y: auto; } }
  .days li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--rule); padding-left: 10px; }
  .days li:first-child { border-top: 0; }
  .days input { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
  .days button { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 6px 12px 6px 4px; border: 0; background: none; text-align: left; }
  .days li.on { background: var(--accent-bg); }
  .days .d { flex: none; width: 50px; font-size: 13px; font-weight: 800; }
  .days .d small { display: block; font-size: 11px; font-weight: 500; color: var(--dim); }
  .days .d.sun { color: var(--bad); }
  .days .tt { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .days .tt.none { color: var(--dim); }
  .days .s { flex: none; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; }

  .ed { border: 1px solid var(--rule); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .ed .h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ed .h b { font-size: 19px; font-weight: 900; }
  .ed .h .sp { flex: 1; }
  .grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .f label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 4px; }
  .f label small { font-weight: 500; color: var(--dim); }
  .in { width: 100%; box-sizing: border-box; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 15px; }
  textarea.in { min-height: 96px; line-height: 1.7; resize: vertical; }
  .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { display: flex; align-items: center; gap: 8px; }
  .opt input[type=radio] { width: 20px; height: 20px; accent-color: var(--ok); flex: none; }
  .hint { margin: 0; font-size: 12.5px; color: var(--dim); }
  .warnbox { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
  .pv { border-radius: 14px; background: var(--soft); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .pv small.k { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; color: var(--dim); }
  .pv b { font-size: 17px; }
  .pv p { margin: 0; font-size: 14px; line-height: 1.8; white-space: pre-line; }
  .pv .ref { font-size: 13px; color: var(--dim); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; white-space: nowrap; max-width: calc(100vw - 40px); overflow: hidden; text-overflow: ellipsis; }
</style>

<header class="gut">
  <div class="wrap hd">
    <div class="t"><b><em>도전!!!</em></b><span class="pl">플랫폼</span></div>
    <span class="me">운영자 · 플랫폼 관리자</span>
  </div>
  <nav class="wrap tabs" aria-label="플랫폼 메뉴">
    <a href="#x">플랫폼 홈</a>
    <a href="https://claude.ai/artifact/1SRjYZY8qvf391srdhijbq">부서</a>
    <a href="#" aria-current="page">공용 콘텐츠</a>
    <a href="#x">성경 데이터</a>
    <a href="#x">기본 규칙</a>
    <a href="https://claude.ai/artifact/QLvGVaxqKS6EcdyhrReFMT">계정 찾기</a>
  </nav>
</header>

<main class="gut"><div class="wrap">
  <h1>공용 콘텐츠</h1>
  <div class="kinds" role="tablist" aria-label="종류" id="kinds"></div>
  <div class="bar">
    <div class="mon"><button type="button" id="prev" aria-label="이전 달">‹</button><b class="num">2027년 1월</b><button type="button" id="next" aria-label="다음 달">›</button></div>
    <div class="cnt" id="cnt"></div>
    <span class="sp"></span>
    <button type="button" class="btn" id="make">빈 날짜 만들기</button>
    <button type="button" class="btn a" id="bulk" disabled>고른 날 공개</button>
  </div>

  <div class="split">
    <ul class="days" id="days" aria-label="날짜"></ul>
    <section class="ed" id="ed" aria-live="polite"></section>
  </div>
</div></main>

<script>
  const $ = (id) => document.getElementById(id);
  const WD = ['금', '토', '일', '월', '화', '수', '목'];
  const KIND = [['w', '말씀'], ['q', '퀴즈'], ['p', '기도'], ['r', '암송']];
  const WORDS = ['새해를 여시는 하나님', '빛이 있으라', '에덴동산', '노아의 방주', '믿음의 종의 기도', '아브라함의 부르심', '롯을 구한 아브라함', '하갈과 이스마엘', '이삭이 태어나다', '모리아 산', '리브가를 만나다', '에서와 야곱', '벧엘의 사다리', '라반의 집', '얍복 강', '요셉의 꿈', '팔려 간 요셉', '감옥 안의 요셉', '바로의 꿈', '형들을 만난 요셉', '용서하는 요셉', '야곱의 축복', '모세가 태어나다', '떨기나무 불꽃', '열 가지 재앙', '유월절', '홍해를 건너다', '만나와 메추라기', '반석에서 나온 물', '십계명', '성막을 짓다'];
  const REFS = ['시편 121편', '창세기 1장', '창세기 2장', '창세기 6~7장', '창세기 24장 1~9절', '창세기 12장', '창세기 14장', '창세기 16장', '창세기 21장', '창세기 22장', '창세기 24장', '창세기 25장', '창세기 28장', '창세기 29장', '창세기 32장', '창세기 37장', '창세기 37장', '창세기 39장', '창세기 41장', '창세기 42장', '창세기 45장', '창세기 49장', '출애굽기 2장', '출애굽기 3장', '출애굽기 7~11장', '출애굽기 12장', '출애굽기 14장', '출애굽기 16장', '출애굽기 17장', '출애굽기 20장', '출애굽기 25장'];
  const TRAITS = [['감사', 'Gratitude'], ['사랑', 'Love'], ['순종', 'Obedience'], ['인내', 'Patience'], ['신뢰', 'Trust'], ['용기', 'Courage'], ['겸손', 'Humility'], ['정직', 'Honesty'], ['온유', 'Gentleness'], ['기쁨', 'Joy'], ['평안', 'Peace'], ['절제', 'Self-control'], ['성실', 'Diligence'], ['지혜', 'Wisdom'], ['친절', 'Kindness'], ['섬김', 'Service'], ['용서', 'Forgiveness'], ['소망', 'Hope'], ['믿음', 'Faith'], ['충성', 'Faithfulness'], ['자비', 'Mercy'], ['양선', 'Goodness'], ['화평', 'Peacemaking'], ['경건', 'Godliness'], ['분별', 'Discernment'], ['책임', 'Responsibility'], ['배려', 'Consideration'], ['나눔', 'Sharing'], ['감사', 'Thanksgiving'], ['찬양', 'Praise'], ['사랑', 'Love']];
  // 날짜별 데이터. 암송은 주(일 ~ 토) 시작일에만 둔다
  const DB = { w: {}, q: {}, p: {}, r: {} };
  for (let d = 1; d <= 31; d++) {
    DB.w[d] = { st: 'pub', title: WORDS[d - 1], ref: REFS[d - 1], story: d === 5 ? '아브라함은 나이가 많아 아들 이삭의 아내를 찾으려고 가장 믿는 종을 보냈어요. 종은 먼 길을 떠나며 하나님께 먼저 기도했어요.' : `${WORDS[d - 1]} 이야기를 읽어요.` };
    DB.q[d] = d === 9 ? null : { st: 'pub', q: d === 5 ? '아브라함의 종은 우물가에 도착해서 가장 먼저 무엇을 했나요?' : `${WORDS[d - 1]} — 오늘 말씀 퀴즈`, opts: d === 5 ? ['물을 마셨어요', '하나님께 기도했어요', '낙타에게 물을 주었어요', '잠을 잤어요'] : ['보기 1', '보기 2', '보기 3', '보기 4'], ans: 1, why: d === 5 ? '종은 먼저 하나님께 도와 달라고 기도했어요(창세기 24:12).' : '' };
    DB.p[d] = { st: d >= 20 ? 'draft' : 'pub', trait: TRAITS[d - 1][0], en: TRAITS[d - 1][1], ref: d === 5 ? '잠언 3장 5~6절' : '', paras: d === 5 ? '하나님, {이름}이(가) 하나님을 온 마음으로 믿게 해 주세요.\n내 생각보다 하나님의 길을 먼저 찾게 해 주세요.' : `하나님, {이름}에게 ${TRAITS[d - 1][0]}의 마음을 주세요.` };
  }
  [[3, '하나님은 우리를 얼마나 사랑하실까요?', '요한복음 3:16', 1], [10, '나의 목자', '시편 23:1', 2], [17, '마음을 다하여', '잠언 3:5', 3], [24, '서로 사랑하라', '요한복음 13:34', 4]]
    .forEach(([d, t, ref, no]) => { DB.r[d] = { st: 'pub', title: t, ref, no, sum: '', point: '', apply: '' }; });
  DB.r[31] = null;
  DB.r[3].sum = '하나님은 세상을 너무 사랑하셔서 하나뿐인 아들 예수님을 보내 주셨어요.'; DB.r[3].point = '하나님의 사랑은 조건이 없어요.'; DB.r[3].apply = '이번 주에 "하나님이 나를 사랑하셔"를 세 번 말해 봐요.';
  let kind = 'w', sel = 5;
  const picked = new Set();
  function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
  const daysOf = () => kind === 'r' ? [3, 10, 17, 24, 31] : Array.from({ length: 31 }, (_, i) => i + 1);
  const label = (d) => kind === 'r' ? `${d}일 ~` : `${d}일`;
  const ttl = (it) => (!it ? '' : kind === 'w' ? it.title : kind === 'q' ? it.q : kind === 'p' ? (it.trait ? `${it.trait} (${it.en || ''})` : '') : it.title) || '';
  const ST = { pub: ['st-pub', '공개'], draft: ['st-draft', '초안'], none: ['st-none', '없음'] };

  function list() {
    const ds = daysOf();
    const c = { pub: 0, draft: 0, none: 0 };
    ds.forEach((d) => { const it = DB[kind][d]; c[it ? it.st : 'none']++; });
    $('cnt').innerHTML = Object.entries(c).filter(([, n]) => n).map(([k, n]) => `<span class="${ST[k][0]}">${ST[k][1]} ${n}</span>`).join('');
    $('days').innerHTML = ds.map((d) => {
      const it = DB[kind][d], s = it ? it.st : 'none', w = WD[(d - 1) % 7];
      return `<li class="${d === sel ? 'on' : ''}"><input type="checkbox" data-p="${d}" aria-label="1월 ${label(d)} 고르기" ${picked.has(d) ? 'checked' : ''} ${s === 'draft' ? '' : 'disabled'}>
        <button type="button" data-d="${d}" aria-current="${d === sel}"><span class="d num${w === '일' ? ' sun' : ''}">${label(d)}<small>${kind === 'r' ? `${Math.min(d + 6, 31)}일까지` : w}</small></span><span class="tt${ttl(it) ? '' : ' none'}">${ttl(it) || (it ? '(아직 비어 있는 초안)' : '비어 있어요')}</span><span class="s ${ST[s][0]}">${ST[s][1]}</span></button></li>`;
    }).join('');
    $('bulk').disabled = !picked.size;
    $('bulk').textContent = picked.size ? `고른 ${picked.size}개 공개` : '고른 날 공개';
  }
  function field(id, lbl, val, opt = {}) {
    const tag = opt.area ? `<textarea class="in" id="${id}" ${opt.ph ? `placeholder="${opt.ph}"` : ''}>${val || ''}</textarea>` : `<input class="in" id="${id}" value="${(val || '').replace(/"/g, '&quot;')}" ${opt.ph ? `placeholder="${opt.ph}"` : ''}>`;
    return `<div class="f"><label for="${id}">${lbl}${opt.sm ? ` <small>${opt.sm}</small>` : ''}</label>${tag}</div>`;
  }
  function editor() {
    const it = DB[kind][sel], w = WD[(sel - 1) % 7], kn = KIND.find((k) => k[0] === kind)[1];
    const s = it ? it.st : 'none';
    let body = '';
    if (!it) body = `<div class="warnbox">이날은 ${kn}이(가) 없어요. 이대로 두면 아이들 화면에 "오늘은 없음"으로 보여요(R-122).</div>`;
    const v = it || {};
    if (kind === 'w') body += `<div class="grid2">${field('t', '제목', v.title)}${field('ref', '본문 범위', v.ref, { ph: '예: 창세기 24장 1~9절' })}</div>${field('story', '오늘 이야기', v.story, { area: 1, sm: '아이들 눈높이로 3 ~ 5문장' })}`;
    if (kind === 'q') body += `${field('qq', '문제', v.q)}<div class="f"><label>보기 <small>정답에 동그라미</small></label><div class="opts">${(v.opts || ['', '', '', '']).map((o, i) => `<div class="opt"><input type="radio" name="ans" aria-label="${i + 1}번이 정답" ${v.ans === i ? 'checked' : ''}><input class="in" value="${o}" aria-label="보기 ${i + 1}"></div>`).join('')}</div></div>${field('why', '해설', v.why, { area: 1, sm: '틀렸을 때 보여 줘요' })}`;
    if (kind === 'p') body += `<div class="grid2">${field('tr', '성품 이름', v.trait)}${field('en', '영어 이름', v.en)}</div>${field('pref', '근거 말씀', v.ref, { ph: '예: 잠언 3장 5~6절' })}${field('paras', '기도문', v.paras, { area: 1, sm: '{이름} 자리에 아이 이름이 들어가요 · 줄을 바꾸면 문단' })}`;
    if (kind === 'r') body += `<div class="grid2">${field('rt', '제목(질문)', v.title)}${field('rref', '암송 구절', v.ref)}</div><div class="grid2">${field('no', '과 번호', v.no ? String(v.no) : '')}${field('sum', '공과 요약', v.sum, { area: 1 })}</div><div class="grid2">${field('pt', '핵심', v.point, { area: 1 })}${field('ap', '적용', v.apply, { area: 1 })}</div>`;
    const pv = kind === 'p' ? (v.paras || '').replace(/\{이름\}/g, '철수') : kind === 'w' ? v.story : kind === 'q' ? (v.opts || []).map((o, i) => `${i + 1}. ${o}`).join('\n') : v.sum;
    $('ed').innerHTML = `<div class="h"><b>1월 ${label(sel)} ${kind === 'r' ? '' : `(${w})`} ${kn}</b><span class="s ${ST[s][0]}" style="font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px">${ST[s][1]}</span><span class="sp"></span><span class="hint">공용 · 모든 부서에 보여요(덮어쓴 부서 빼고)</span></div>
      ${body}
      <div class="pv" aria-label="아이 화면 미리보기"><small class="k">아이 화면 미리보기 · 김철수</small><b>${ttl(v) || '(제목)'}</b>${kind !== 'q' && (v.ref) ? `<span class="ref">${v.ref}</span>` : ''}<p>${pv || '(내용)'}</p></div>
      ${it && it.st === 'pub' ? '<p class="hint">이미 공개됐어요. 고쳐도 이미 한 아이들의 기록 · 점수는 그대로예요(R-124).</p>' : ''}
      <div class="acts"><button type="button" class="btn" data-a="draft">초안으로 저장</button><button type="button" class="btn a" data-a="pub">${it && it.st === 'pub' ? '고친 내용 공개' : '공개'}</button></div>`;
  }
  function kinds() { $('kinds').innerHTML = KIND.map(([k, n]) => `<button type="button" role="tab" data-k="${k}" aria-selected="${k === kind}">${n}</button>`).join(''); }
  function draw() { kinds(); list(); editor(); }
  $('kinds').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; picked.clear(); sel = kind === 'r' ? 3 : 5; draw(); });
  $('days').addEventListener('click', (e) => {
    const c = e.target.closest('[data-p]'); if (c) { c.checked ? picked.add(+c.dataset.p) : picked.delete(+c.dataset.p); list(); return; }
    const b = e.target.closest('[data-d]'); if (b) { sel = +b.dataset.d; list(); editor(); }
  });
  $('ed').addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const it = DB[kind][sel] || (DB[kind][sel] = {});
    if (kind === 'w') Object.assign(it, { title: $('t').value, ref: $('ref').value, story: $('story').value });
    if (kind === 'p') Object.assign(it, { trait: $('tr').value, en: $('en').value, ref: $('pref').value, paras: $('paras').value });
    if (kind === 'r') Object.assign(it, { title: $('rt').value, ref: $('rref').value, no: $('no').value, sum: $('sum').value, point: $('pt').value, apply: $('ap').value });
    if (kind === 'q') { const ins = [...document.querySelectorAll('.opt .in')]; Object.assign(it, { q: $('qq').value, opts: ins.map((i) => i.value), ans: [...document.querySelectorAll('.opt input[type=radio]')].findIndex((r) => r.checked), why: $('why').value }); }
    it.st = b.dataset.a === 'pub' ? 'pub' : 'draft';
    toast(it.st === 'pub' ? '공개했어요 · 덮어쓰지 않은 모든 부서에 보여요' : '초안으로 저장했어요 · 아이들에게는 아직 안 보여요');
    list(); editor();
  });
  $('bulk').onclick = () => { picked.forEach((d) => { if (DB[kind][d]) DB[kind][d].st = 'pub'; }); toast(`${picked.size}개를 공개했어요`); picked.clear(); list(); editor(); };
  $('make').onclick = () => { let n = 0; daysOf().forEach((d) => { if (!DB[kind][d]) { DB[kind][d] = { st: 'draft' }; n++; } }); toast(n ? `빈 날짜 ${n}개를 초안으로 만들었어요` : '이 달은 빈 날짜가 없어요'); list(); editor(); };
  $('prev').onclick = $('next').onclick = () => toast('다른 달은 시안에 없어요');
  document.querySelectorAll('nav a[href="#x"]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); toast(`${a.textContent} 화면으로 가요 (다음 시안)`); }));
  draw();
</script>
