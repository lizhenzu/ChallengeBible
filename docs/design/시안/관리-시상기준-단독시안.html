<title>시상 기준 설정 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
  /* 레이아웃(/{slug}/admin/teams/stages, ADR 0090 · R-96): 관리 머리말 · 메뉴(가족팀) → 제목 → 해 고르기(올해 / 내년) → 지금 쓰는 기준 띠(기본값 / 우리 부서) → 단계 목록(점수 · 종류 · 문구 · 켜기) → 단계 더하기 → 안내.
     상태 바꾸기 띠는 화면 맨 아래(휴대폰 보기 창 버튼이 위를 가림) */
  :root {
    --bg: #FFFFFF; --soft: #F5F6F8; --hero: #F2F5FB; --fg: #1B1F24; --dim: #5B6470; --rule: #E3E6EA; --line: #C9CED5;
    --accent: #2B59C3; --accent-bg: #EAF0FB; --on-accent: #FFFFFF; --ok: #16A34A; --ok-bg: #EAF7EF; --warn: #9A5B00; --warn-bg: #FFF4DE; --bad: #B42318; --bad-bg: #FDECEC;
    --award: #B45309; --award-bg: #FFF1D6; --clap: #2B59C3; --clap-bg: #EAF0FB;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #14171B; --soft: #1B1F25; --hero: #18202E; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #7FA2F2; --accent-bg: #1C2740; --on-accent: #0E1013; --ok: #5CC98A; --ok-bg: #1B2A22; --warn: #F2C063; --warn-bg: #2E2614; --bad: #F5A3A6; --bad-bg: #2E1B1C;
    --award: #F2C063; --award-bg: #2E2614; --clap: #7FA2F2; --clap-bg: #1C2740; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #14171B; --soft: #1B1F25; --hero: #18202E; --fg: #E8EAED; --dim: #A3AAB4; --rule: #2C323A; --line: #3A414A;
    --accent: #7FA2F2; --accent-bg: #1C2740; --on-accent: #0E1013; --ok: #5CC98A; --ok-bg: #1B2A22; --warn: #F2C063; --warn-bg: #2E2614; --bad: #F5A3A6; --bad-bg: #2E1B1C;
    --award: #F2C063; --award-bg: #2E2614; --clap: #7FA2F2; --clap-bg: #1C2740; color-scheme: dark }

  html, body { background: var(--bg); }
  body { color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; margin: 0; padding-bottom: 88px; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  a:focus-visible, button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 760px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
  .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
  .hd .t { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .hd .t small { font-size: 12px; color: var(--dim); }
  .hd .t b { font-size: 17px; font-weight: 900; }
  .hd .t b em { font-style: normal; color: var(--accent); }
  .back { flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; font-weight: 700; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
  nav.tabs a { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 700; color: var(--dim); border-bottom: 3px solid transparent; }
  nav.tabs a[aria-current] { color: var(--fg); border-color: var(--accent); }

  main .wrap { padding-block: 18px 40px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 900; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--accent); }
  .lead { margin: -6px 0 0; font-size: 13.5px; color: var(--dim); }

  .years { display: flex; gap: 6px; }
  .years button { flex: 1; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15px; font-weight: 800; }
  .years button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .years button small { font-weight: 500; font-size: 12px; margin-left: 4px; opacity: .85; }

  .now { padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--hero); }
  .now .k { font-size: 13px; font-weight: 800; letter-spacing: .06em; color: var(--accent); }
  .now.mine { background: var(--ok-bg); } .now.mine .k { color: var(--ok); }
  .now p { margin: 0; font-size: 14px; }
  .now .acts { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { min-height: 46px; padding: 0 16px; border-radius: 12px; font-size: 15px; font-weight: 800; border: 0; background: var(--accent); color: var(--on-accent); }
  .btn.s { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .btn.bad { background: var(--bg); color: var(--bad); border: 1px solid var(--bad); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .st { border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
  .st.off { background: var(--soft); }
  .st.off .msg, .st.off .pt { color: var(--dim); }
  .st .top { display: flex; align-items: center; gap: 12px; }
  .st .em { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: var(--award-bg); }
  .st[data-type="APPLAUSE"] .em { background: var(--clap-bg); }
  .st .pt { font-size: 22px; font-weight: 900; line-height: 1.1; }
  .st .pt small { font-size: 13px; font-weight: 700; margin-left: 2px; }
  .st .tp { margin-left: auto; align-self: flex-start; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: var(--award-bg); color: var(--award); white-space: nowrap; }
  .st[data-type="APPLAUSE"] .tp { background: var(--clap-bg); color: var(--clap); }
  .st .msg { margin: 0; font-size: 14.5px; font-weight: 700; word-break: keep-all; }
  .st .lock { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; }
  .st .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sw { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .sw input { width: 22px; height: 22px; accent-color: var(--accent); }
  .st .bar .sp { flex: 1; }
  .edit { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }

  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > label, .fld > span.l { font-size: 13px; font-weight: 800; }
  .fld input[type=text], .fld input[type=number] { min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 16px; width: 100%; box-sizing: border-box; }
  .fld input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-bg); }
  .fld input:disabled { background: var(--soft); color: var(--dim); cursor: not-allowed; }
  .fld small { font-size: 12.5px; color: var(--dim); }
  .fld small.e { color: var(--bad); font-weight: 700; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 10px; }
  .kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kinds label { display: flex; flex-direction: column; gap: 2px; min-height: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 800; }
  .kinds label small { font-weight: 500; font-size: 12.5px; color: var(--dim); }
  .kinds input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .kinds label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }
  .kinds label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }

  .card { border: 1px solid var(--rule); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 small { font-size: 13px; font-weight: 500; color: var(--dim); }
  .prev { padding: 14px; border-radius: 14px; background: var(--hero); display: flex; gap: 12px; align-items: center; }
  .prev .em { font-size: 30px; }
  .prev b { font-size: 15px; display: block; }
  .prev small { color: var(--dim); font-size: 12.5px; }
  .muted { margin: 0; font-size: 13.5px; color: var(--dim); }
  .note { padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 13.5px; color: var(--dim); }
  .note b { color: var(--fg); }
  .ok-msg { padding: 10px 14px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); font-weight: 800; font-size: 14px; }

  .states { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--fg); color: var(--bg); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
  .states button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--bg); font-size: 13px; font-weight: 800; opacity: .7; }
  .states button[aria-pressed="true"] { background: var(--bg); color: var(--fg); opacity: 1; }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; max-width: calc(100vw - 40px); text-align: center; }
</style>

<header class="gut">
  <div class="wrap hd">
    <div class="t"><small>잠실새내교회 · 유년부</small><b><em>도전!!!</em> 관리</b></div>
    <a class="back" href="#">부서 홈으로</a>
  </div>
  <nav class="wrap tabs" aria-label="관리 메뉴">
    <a href="#">관리 홈</a><a href="#">소속 관리</a><a href="#">진급</a><a href="#">콘텐츠</a><a href="#">통독 현황</a><a href="#">시즌</a><a href="#" aria-current="page">가족팀</a><a href="#">이름 · 색</a>
  </nav>
</header>

<main class="gut"><div class="wrap">
  <a class="crumb" href="#">‹ 가족팀</a>
  <h1>시상 기준</h1>
  <p class="lead">가족팀 점수가 이 점수를 넘으면 가족에게 축하 카드가 떠요. 점수가 얼마일 때 축하할지 해마다 정해요.</p>

  <div class="years" role="group" aria-label="해 고르기">
    <button type="button" data-y="2027" aria-pressed="true">올해 <small>2027</small></button>
    <button type="button" data-y="2028" aria-pressed="false">내년 <small>2028</small></button>
  </div>

  <div id="okmsg" class="ok-msg" role="status" hidden></div>

  <section class="now" id="now" aria-live="polite"></section>

  <ul class="stages" id="list" aria-label="시상 단계"></ul>

  <section class="card" id="addcard" aria-labelledby="hAdd">
    <h2 id="hAdd">단계 더하기 <small>점수는 겹치면 안 돼요</small></h2>
    <div class="fld">
      <label for="aPt">넘으면 축하할 점수</label>
      <input id="aPt" type="number" inputmode="numeric" min="1" max="100000" placeholder="예: 6000" autocomplete="off">
      <small id="aPtH">1 ~ 100,000점</small>
    </div>
    <div class="fld">
      <span class="l" id="aKl">축하 종류</span>
      <div class="kinds" role="radiogroup" aria-labelledby="aKl">
        <label><input type="radio" name="aK" value="AWARD" checked>축하 + 보상<small>선물을 받는 단계</small></label>
        <label><input type="radio" name="aK" value="APPLAUSE">박수만<small>칭찬만 하는 단계</small></label>
      </div>
    </div>
    <div class="two">
      <div class="fld"><label for="aTx">축하 문구</label><input id="aTx" type="text" maxlength="50" placeholder="예: 6,000점! 대단해요" autocomplete="off"><small>50자까지</small></div>
      <div class="fld"><label for="aEm">그림</label><input id="aEm" type="text" maxlength="2" value="🎉" autocomplete="off" aria-describedby="aEmH"><small id="aEmH">이모지</small></div>
    </div>
    <div class="prev" aria-label="미리 보기"><span class="em" id="pEm">🎉</span><div><b id="pTx">문구를 쓰면 이렇게 보여요</b><small id="pSm">가족팀 홈에 뜨는 축하 카드</small></div></div>
    <button type="button" class="btn" id="aGo">단계 더하기</button>
  </section>

  <p class="note" id="foot"></p>
</div></main>

<div class="states" role="group" aria-label="시안 상태 바꾸기">
  <button type="button" data-s="default" aria-pressed="true">기본값 쓰는 중</button>
  <button type="button" data-s="mine" aria-pressed="false">우리 부서 기준</button>
  <button type="button" data-s="error" aria-pressed="false">겹침 · 잠금</button>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const DEFAULTS = [
    { p: 1000, t: 'AWARD', x: '첫 1,000점! 가족이 함께 해냈어요', e: '🎉' },
    { p: 2000, t: 'APPLAUSE', x: '2,000점 돌파, 박수!', e: '👏' },
    { p: 3000, t: 'AWARD', x: '3,000점! 가족이 함께 해냈어요', e: '🎉' },
    { p: 4000, t: 'APPLAUSE', x: '4,000점 돌파, 박수!', e: '👏' },
    { p: 5000, t: 'AWARD', x: '5,000점! 최고의 가족', e: '🏆' }
  ];
  const MINE = [
    { p: 500, t: 'APPLAUSE', x: '500점 돌파, 박수!', e: '👏', on: true },
    { p: 1500, t: 'AWARD', x: '1,500점! 가족이 함께 해냈어요', e: '🎉', on: true },
    { p: 3000, t: 'AWARD', x: '3,000점! 가족이 함께 해냈어요', e: '🎉', on: true, given: 3 },
    { p: 5000, t: 'AWARD', x: '5,000점! 최고의 가족', e: '🏆', on: false }
  ];
  let state = 'default', year = 2027, open = -1, rows = JSON.parse(JSON.stringify(MINE));
  const fmt = (n) => n.toLocaleString('ko-KR');
  const toast = (t) => { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); };
  const say = (t) => { const m = $('okmsg'); m.textContent = t; m.hidden = !t; };
  const kind = (t) => t === 'AWARD' ? '축하 + 보상' : '박수만';

  function renderNow() {
    const n = $('now');
    if (year === 2028 && state === 'default') {
      n.className = 'now';
      n.innerHTML = `<span class="k">2028 · 아직 정하지 않았어요</span><p>내년 기준을 정하지 않으면 새해가 되었을 때 <b>기본값</b>을 써요. 미리 정해 두면 새해 첫날부터 우리 부서 기준이 적용돼요.</p><div class="acts"><button type="button" class="btn sm" data-a="own">기본값에서 시작해 정하기</button></div>`;
    } else if (state === 'default') {
      n.className = 'now';
      n.innerHTML = `<span class="k">2027 · 기본값을 쓰고 있어요</span><p>우리 부서만의 기준을 정하지 않아서 모든 부서가 같이 쓰는 기본 기준이에요. 아래 5단계가 그것이에요.</p><div class="acts"><button type="button" class="btn sm" data-a="own">우리 부서 기준으로 정하기</button></div>`;
    } else {
      n.className = 'now mine';
      n.innerHTML = `<span class="k">${year} · 우리 부서 기준</span><p>${rows.filter((r) => r.on).length}단계가 켜져 있어요. 켜진 단계만 가족에게 보여요.</p><div class="acts"><button type="button" class="btn s sm" data-a="reset">기본값으로 되돌리기</button></div>`;
    }
  }

  function renderList() {
    const L = $('list');
    const isDef = state === 'default';
    if (year === 2028 && isDef) { L.innerHTML = ''; $('addcard').hidden = true; return; }
    const data = isDef ? DEFAULTS.map((d) => ({ ...d, on: true, ro: true })) : rows;
    $('addcard').hidden = isDef;
    L.innerHTML = data.map((r, i) => {
      const edit = open === i && !r.ro;
      return `<li class="st ${r.on ? '' : 'off'}" data-type="${r.t}">
        <div class="top"><span class="em" aria-hidden="true">${r.e}</span><div><div class="pt num">${fmt(r.p)}<small>점</small></div></div><span class="tp">${kind(r.t)}</span></div>
        <p class="msg">${r.x}</p>
        ${r.given ? `<div class="lock" role="note">🔒 <span>${r.given}팀이 이미 받았어요. 점수는 못 바꾸고 지울 수도 없어요. 문구 · 그림은 바꿀 수 있어요.</span></div>` : ''}
        ${r.ro ? '' : `<div class="bar">
          <label class="sw"><input type="checkbox" data-a="on" data-i="${i}" ${r.on ? 'checked' : ''}> ${r.on ? '켜짐' : '꺼짐'}</label><span class="sp"></span>
          <button type="button" class="btn s sm" data-a="edit" data-i="${i}" aria-expanded="${edit}">${edit ? '닫기' : '고치기'}</button>
          ${r.given ? '' : `<button type="button" class="btn bad sm" data-a="del" data-i="${i}">지우기</button>`}</div>`}
        ${edit ? `<div class="edit">
          <div class="fld"><label for="ePt${i}">점수</label><input id="ePt${i}" type="number" inputmode="numeric" value="${r.p}" ${r.given ? 'disabled' : ''}>${r.given ? '<small>이미 받은 단계라 점수는 못 바꿔요</small>' : ''}</div>
          <div class="fld"><span class="l">축하 종류</span><div class="kinds" role="radiogroup"><label><input type="radio" name="eK${i}" value="AWARD" ${r.t === 'AWARD' ? 'checked' : ''}>축하 + 보상<small>선물을 받는 단계</small></label><label><input type="radio" name="eK${i}" value="APPLAUSE" ${r.t === 'APPLAUSE' ? 'checked' : ''}>박수만<small>칭찬만 하는 단계</small></label></div></div>
          <div class="two"><div class="fld"><label for="eTx${i}">축하 문구</label><input id="eTx${i}" type="text" maxlength="50" value="${r.x}"></div><div class="fld"><label for="eEm${i}">그림</label><input id="eEm${i}" type="text" maxlength="2" value="${r.e}"></div></div>
          <button type="button" class="btn sm" data-a="save" data-i="${i}">저장</button></div>` : ''}
      </li>`;
    }).join('');
  }

  function renderFoot() {
    const mine = state !== 'default';
    $('foot').innerHTML = mine
      ? '<b>알아 두세요.</b> 켜진 단계가 하나는 있어야 해요(모두 끄면 기본값으로 돌아가요). 이미 가족이 받은 단계는 점수를 바꾸거나 지울 수 없어요. 해가 바뀌면 그 해 기준이 새로 적용돼요.'
      : '<b>알아 두세요.</b> 기본값은 플랫폼이 정한 기준이라 여기서 고칠 수 없어요. 우리 부서만 다르게 하고 싶을 때 “우리 부서 기준으로 정하기”를 눌러요.';
  }

  function paint() { renderNow(); renderList(); renderFoot(); }
  function setState(s) {
    state = s; open = -1; say('');
    document.querySelectorAll('.states button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === s)));
    $('aPt').value = ''; $('aPt').removeAttribute('aria-invalid'); $('aPtH').className = ''; $('aPtH').textContent = '1 ~ 100,000점';
    if (s === 'error') { state = 'mine'; open = 2; $('aPt').value = '3000'; checkPt(); }
    paint();
  }
  function checkPt() {
    const v = Number($('aPt').value), h = $('aPtH');
    const dup = rows.some((r) => r.p === v);
    const bad = $('aPt').value !== '' && (v < 1 || v > 100000 || dup);
    $('aPt').setAttribute('aria-invalid', String(bad));
    h.className = bad ? 'e' : '';
    h.textContent = dup ? `${fmt(v)}점 단계가 이미 있어요. 다른 점수를 쓰거나 그 단계를 고쳐 주세요.` : (bad ? '1 ~ 100,000점 사이로 써 주세요.' : '1 ~ 100,000점');
    return !bad && $('aPt').value !== '';
  }
  function preview() {
    $('pEm').textContent = $('aEm').value || '🎉';
    $('pTx').textContent = $('aTx').value || '문구를 쓰면 이렇게 보여요';
    const k = document.querySelector('input[name=aK]:checked').value;
    $('pSm').textContent = `가족팀 홈에 뜨는 축하 카드 · ${kind(k)}`;
  }

  document.querySelectorAll('.years button').forEach((b) => b.addEventListener('click', () => {
    year = Number(b.dataset.y); say('');
    document.querySelectorAll('.years button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    paint();
  }));
  document.querySelectorAll('.states button').forEach((b) => b.addEventListener('click', () => setState(b.dataset.s)));
  $('aPt').addEventListener('input', checkPt);
  ['aTx', 'aEm'].forEach((id) => $(id).addEventListener('input', preview));
  document.querySelectorAll('input[name=aK]').forEach((r) => r.addEventListener('change', preview));
  $('aGo').addEventListener('click', () => {
    if (!checkPt() || !$('aTx').value.trim()) { toast('점수와 축하 문구를 확인해 주세요'); return; }
    rows.push({ p: Number($('aPt').value), t: document.querySelector('input[name=aK]:checked').value, x: $('aTx').value.trim(), e: $('aEm').value || '🎉', on: true });
    rows.sort((a, b) => a.p - b.p); $('aPt').value = ''; $('aTx').value = ''; checkPt(); preview(); say('단계를 더했어요'); paint();
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, i = Number(b.dataset.i);
    if (a === 'own') { state = 'mine'; rows = JSON.parse(JSON.stringify(year === 2028 ? DEFAULTS.map((d) => ({ ...d, on: true })) : MINE)); document.querySelectorAll('.states button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.s === 'mine'))); say('기본값을 복사했어요. 이제 마음대로 고칠 수 있어요'); paint(); }
    if (a === 'reset') { if (confirm('우리 부서 기준을 지우고 기본값으로 돌아갈까요?')) { state = 'default'; document.querySelectorAll('.states button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.s === 'default'))); say('기본값으로 되돌렸어요'); paint(); } }
    if (a === 'edit') { open = open === i ? -1 : i; paint(); }
    if (a === 'on') { const on = b.checked; if (!on && rows.filter((r) => r.on).length === 1) { b.checked = true; toast('켜진 단계가 하나는 있어야 해요'); return; } rows[i].on = on; paint(); }
    if (a === 'del') { if (rows.filter((r) => r.on).length === 1 && rows[i].on) { toast('켜진 단계가 하나는 있어야 해요'); return; } rows.splice(i, 1); say('단계를 지웠어요'); paint(); }
    if (a === 'save') {
      const p = Number($('ePt' + i).value), dup = rows.some((r, k) => k !== i && r.p === p);
      if (dup || p < 1) { toast(dup ? `${fmt(p)}점 단계가 이미 있어요` : '점수를 확인해 주세요'); return; }
      Object.assign(rows[i], { p, t: document.querySelector(`input[name=eK${i}]:checked`).value, x: $('eTx' + i).value.trim() || rows[i].x, e: $('eEm' + i).value || rows[i].e });
      rows.sort((a, b2) => a.p - b2.p); open = -1; say('저장했어요'); paint();
    }
  });
  paint(); preview();
  { const h = location.hash.slice(1); if (h === 'next') document.querySelector('[data-y="2028"]').click(); else if (h) setState(h); }   // 캡처용: #mine · #error · #next
</script>
