<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>성장 단계 아이콘 시안 (지금 · A · B · C)</title>
<style>
:root{--ink:#1d1d1f;--ink-3:#8e8e94;--line:#e7e7ea;--track:#ededef;--p1:#1f9d55;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#e9ebef;color:var(--ink);word-break:keep-all;letter-spacing:-.01em}
.bar{background:#161c2b;color:#fff;font-size:12.5px;height:38px;display:flex;align-items:center;padding:0 22px}
.stage{display:grid;grid-template-columns:repeat(4,300px);gap:18px;padding:28px 18px 40px;justify-content:center}
.col{background:#fff;border-radius:10px;padding:18px 16px 20px;box-shadow:0 20px 50px -40px #000}
.cap{font-size:14px;font-weight:900;margin-bottom:4px}.cap small{display:block;margin-top:4px;font-size:11.5px;font-weight:600;line-height:1.6;color:#5b6470}
.ringbox{display:flex;justify-content:center;margin:16px 0 14px}
.ring{position:relative;width:112px;height:112px}.ring svg{display:block;transform:rotate(-90deg)}
.in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center}
.pts{font-size:23px;font-weight:900;color:#17663a;letter-spacing:-.045em;line-height:1.1}.pts i{font-style:normal;font-size:11px;margin-left:1px;color:#3f7a58}
.stg{margin-top:1px;font-size:11.5px;font-weight:800;color:#5f8a71;white-space:nowrap;display:flex;align-items:center;gap:3px}
.stg svg{width:15px;height:15px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.steps div{text-align:center;padding:9px 0 8px;border-radius:12px;background:#f4f4f5}
.steps div.now{background:#e8f6ee;outline:1.5px solid #bfe4cd}
.steps .ic{font-size:21px;line-height:1.2;height:26px;display:flex;align-items:center;justify-content:center}
.steps .ic svg{width:24px;height:24px}
.steps b{display:block;margin-top:3px;font-size:11px;font-weight:800;color:#56565c}
.steps div.now b{color:#17663a}
.steps div.off .ic{opacity:.35;filter:grayscale(1)}
</style></head><body>
<div class="bar">시안 · 성장 단계 아이콘 — 씨앗 · 새싹 · 나무 · 숲 (지금 단계 = 씨앗, 12점 예시)</div>
<div class="stage" id="s"></div>
<script>
const G='#1f9d55',G2='#17663a',L='#7fc79d';
const svg=(b)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const ICON={ // C안: 단색 선 아이콘(브랜드 초록)
 seed:svg('<path d="M12 21c-3.3 0-5.5-2.2-5.5-5.2C6.5 11.5 9.5 7 12 4c2.5 3 5.5 7.5 5.5 11.800C17.500 18.800 15.300 21 12 21z"/><path d="M12 9v9"/>'),
 sprout:svg('<path d="M12 21v-9"/><path d="M12 12c0-4 2.600-6.500 7-6.500 0 4-2.600 6.500-7 6.500z"/><path d="M12 15c0-3-2-5-5.500-5 0 3 2 5 5.500 5z"/>'),
 tree:svg('<path d="M12 21v-6"/><circle cx="12" cy="9.500" r="6"/><path d="M12 15l-3-3M12 13l3-3"/>'),
 forest:svg('<path d="M7 21v-3M17 21v-3M12 21v-4"/><path d="M7 18l-3.500-1 3.500-6 3.500 6zM17 18l-3.500-1 3.500-6 3.500 6z"/><path d="M12 17l-3.500-1.200L12 8l3.500 7.800z"/>'),
};
const SETS=[
 {t:'지금',c:'🌰만 갈색이라 홈 색과 어긋남',n:['씨앗','새싹','나무','숲'],i:['🌰','🌱','🌿','🌲']},
 {t:'A · 초록 이모지로 통일',c:'씨앗 ☘️ · 새싹 🌱 · 나무 🌳 · 숲 🌲 — 전부 초록 계열. 기기마다 모양은 조금 다름',n:['씨앗','새싹','나무','숲'],i:['☘️','🌱','🌳','🌲']},
 {t:'B · 브랜드 네잎으로 마무리',c:'🌱 → 🌿 → 🌳 → 🍀(숲 = 네잎). 로고의 네잎과 이어짐. 단계 이름은 그대로',n:['씨앗','새싹','나무','숲'],i:['🌱','🌿','🌳','🍀']},
 {t:'C · 단색 선 아이콘(추천)',c:'브랜드 초록 한 가지 색의 선 그림. 폰마다 똑같이 보이고 홈의 모노 톤과 가장 어울림',n:['씨앗','새싹','나무','숲'],i:[ICON.seed,ICON.sprout,ICON.tree,ICON.forest]}
];
const R=(i)=>`<div class="ringbox"><div class="ring"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="51.500" fill="none" stroke="#ededef" stroke-width="9" stroke-linecap="round"/><circle cx="56" cy="56" r="51.500" fill="none" stroke="#1f9d55" stroke-width="9" stroke-linecap="round" stroke-dasharray="323.600" stroke-dashoffset="285"/></svg><div class="in"><b class="pts">12<i>점</i></b><span class="stg">${i}&nbsp;씨앗</span></div></div></div>`;
document.getElementById('s').innerHTML=SETS.map(s=>{
 const small=s.i[0].startsWith('<svg')?s.i[0]:s.i[0];
 return `<div class="col"><p class="cap">${s.t}<small>${s.c}</small></p>${R(small)}<div class="steps">${s.n.map((n,k)=>`<div class="${k==0?'now':'off'}"><span class="ic">${s.i[k]}</span><b>${n}</b></div>`).join('')}</div></div>`}).join('');
</script></body></html>
