<title>내 점수 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap">
<style>
  /* 레이아웃(DailyMission4/UserMonthlyPoints · UserDailyPoints 구성): 위쪽 줄 → 도전!!!성경말씀 + 월별 · 일자별 전환 → (월별) 달 머리 · 총점 상자 · 월 탭 · 달력 · 미션별 합계 / (일자별) 이름 · 총점 상자 · 날짜별 표 */
  :root {
    --bg: #FFFFFF; --soft: #F3F5F8; --fg: #1B1F24; --tx: #1F2937; --dim: #6B7280; --dim2: #4B5563; --rule: #E5E7EB;
    --accent: #2B59C3; --on-accent: #FFFFFF; --no: #7FA3DB; --cell: #EAF0FB; --bar: #DCE5F7;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15181C; --soft: #1D2127; --fg: #E8EAED; --tx: #E1E4E8; --dim: #9AA1AB; --dim2: #B3B9C2; --rule: #2C323A;
    --accent: #7FA2F2; --on-accent: #0E1013; --no: #6E8FCB; --cell: #1F2A3F; --bar: #283652; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #15181C; --soft: #1D2127; --fg: #E8EAED; --tx: #E1E4E8; --dim: #9AA1AB; --dim2: #B3B9C2; --rule: #2C323A;
    --accent: #7FA2F2; --on-accent: #0E1013; --no: #6E8FCB; --cell: #1F2A3F; --bar: #283652; color-scheme: dark }

  html, body { background: var(--bg); }
  body { color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .col { max-width: 560px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  [hidden] { display: none !important; }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
  .bar .col > div { display: flex; align-items: center; justify-content: space-between; min-height: 58px; border-bottom: 1px solid var(--rule); }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: var(--dim2); }
  .crumb a { min-height: 44px; display: inline-flex; align-items: center; }
  .crumb span { color: var(--rule); }
  .who0 { font-size: 13px; letter-spacing: .1em; color: var(--dim); }

  main { padding-block: 18px 48px; }
  .k { font-size: 13px; font-weight: 800; color: var(--accent); }
  .seg { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 12px; background: var(--soft); }
  .seg button { min-height: 42px; border: 0; border-radius: 9px; background: none; font-size: 15px; font-weight: 700; color: var(--dim); }
  .seg button[aria-selected="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .mh { margin-top: 22px; display: flex; justify-content: space-between; align-items: flex-end; }
  .mh h1 { margin: 0; font-size: 26px; font-weight: 900; }
  .mh p { margin: 2px 0 0; font-size: 13px; color: var(--dim); }
  .arr { display: flex; gap: 2px; }
  .arr button { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--dim); }
  .arr button:disabled { opacity: .3; cursor: default; }
  .tot { margin-top: 16px; display: grid; grid-template-columns: 1.3fr 1fr; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--rule); }
  .tot div { padding: 14px 4px; }
  .tot div + div { border-left: 1px solid var(--rule); padding-left: 16px; }
  .tot small { display: block; font-size: 12px; color: var(--dim); }
  .tot b { display: block; font-size: 38px; font-weight: 300; line-height: 1.15; color: var(--accent); }
  .tot b u { text-decoration: none; font-size: 15px; color: var(--dim); margin-left: 2px; }
  .tot div + div b { font-size: 26px; color: var(--fg); margin-top: 8px; }
  .tabs { margin-top: 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs button { flex: none; width: 40px; height: 36px; border-radius: 18px; border: 1px solid var(--rule); background: var(--bg); font-size: 13px; font-weight: 700; color: var(--dim2); }
  .tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tabs button:disabled { opacity: .35; cursor: default; }

  .dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow { margin-top: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); text-align: center; font-size: 13px; color: var(--dim); }
  .grid a, .grid span { height: 60px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 17px; }
  .grid > :nth-child(-n+7) { border-top-color: transparent; }
  .grid small { font-size: 13px; font-weight: 700; color: var(--accent); }
  .grid .o { color: var(--dim); opacity: .45; }
  .grid .o small, .grid .f small { color: var(--dim); font-weight: 400; }
  .grid .all { background: var(--cell); border-radius: 14px; }
  .grid .today { box-shadow: 0 0 0 3px var(--accent) inset; border-radius: 14px; font-weight: 700; }
  .leg { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--dim); }
  .leg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

  .lbl { margin-top: 28px; padding-bottom: 8px; border-bottom: 1px solid var(--fg); font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: .1em; }
  .mr { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .mr .no { font-weight: 900; font-size: 15px; color: var(--no); }
  .mr .nm { font-size: 16px; font-weight: 800; }
  .mr .bw { height: 8px; border-radius: 4px; background: var(--bar); overflow: hidden; }
  .mr .bw i { display: block; height: 8px; background: var(--accent); }
  .mr .v { font-size: 22px; font-weight: 300; text-align: right; }
  .mr .v u { text-decoration: none; font-size: 12px; color: var(--dim); margin-left: 1px; }
  .mr .meta { grid-column: 3 / 5; font-size: 12px; color: var(--dim); }

  .whoRow { margin-top: 22px; display: flex; align-items: center; gap: 12px; }
  .av { width: 48px; height: 48px; border-radius: 50%; background: var(--cell); color: var(--accent); display: grid; place-content: center; font-weight: 900; font-size: 18px; }
  .whoRow b { display: block; font-size: 18px; }
  .whoRow small { font-size: 13px; color: var(--dim); }
  .tw { margin-top: 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 11px 4px; text-align: center; border-bottom: 1px solid var(--rule); }
  thead th { font-size: 12px; font-weight: 700; color: var(--dim); border-bottom: 1px solid var(--fg); }
  th.l, td.l { text-align: left; padding-left: 6px; }
  td.l a { display: inline-flex; align-items: baseline; gap: 6px; min-height: 28px; }
  td.l b { font-size: 16px; }
  td.l span { font-size: 12px; color: var(--dim); }
  td.z { color: var(--dim); }
  td.sum { font-weight: 800; color: var(--accent); }
  tr.today td { background: var(--cell); }
  tfoot td { font-weight: 800; border-bottom: 0; border-top: 1px solid var(--fg); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; white-space: nowrap; }
</style>

<div class="bar">
  <div class="col"><div>
    <nav class="crumb" aria-label="위치"><a href="https://claude.ai/artifact/NPStHNG39PrnSZJvrcWH11">홈으로</a><span aria-hidden="true">·</span><a href="https://claude.ai/artifact/QYa8ThNwp18tv4drEP7ae2">미션홈</a></nav>
    <span class="who0 num">2027.01</span>
  </div></div>
</div>

<main class="col">
  <div class="k">도전!!!성경말씀 · 내 점수</div>
  <div class="seg" role="tablist" aria-label="보기">
    <button type="button" role="tab" id="tM" aria-selected="true" aria-controls="pM">월별</button>
    <button type="button" role="tab" id="tD" aria-selected="false" aria-controls="pD">일자별</button>
  </div>

  <section id="pM" role="tabpanel" aria-labelledby="tM">
    <div class="mh">
      <div><h1 class="num">2027년 1월</h1><p class="num">1월 1일 ~ 1월 5일</p></div>
      <div class="arr"><button type="button" disabled aria-label="이전 달">←</button><button type="button" disabled aria-label="다음 달">→</button></div>
    </div>
    <div class="tot">
      <div><small>이달 총점</small><b class="num" id="mTot">24<u>점</u></b></div>
      <div><small>수행한 날</small><b class="num">5 / 5</b></div>
    </div>
    <div class="tabs" role="group" aria-label="월 고르기" id="tabs"></div>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
    <div class="leg"><span><i style="box-shadow:0 0 0 2px var(--accent) inset"></i>오늘</span><span><i style="background:var(--cell)"></i>네 가지 모두</span><span>숫자 = 그날 점수 · 날짜를 누르면 그날 미션</span></div>

    <div class="lbl">미션별 합계</div>
    <div id="rows"></div>
  </section>

  <section id="pD" role="tabpanel" aria-labelledby="tD" hidden>
    <div class="whoRow"><span class="av">철</span><div><b>철수님</b><small class="num">1월 1일 ~ 1월 5일 · 일일 수행 현황</small></div></div>
    <div class="tot">
      <div><small>이 기간 총점</small><b class="num">24<u>점</u></b></div>
      <div><small>수행한 날</small><b class="num">5 / 5</b></div>
    </div>
    <div class="lbl">날짜별</div>
    <div class="tw">
      <table>
        <thead><tr><th class="l" scope="col">날짜</th><th scope="col">말씀</th><th scope="col">퀴즈</th><th scope="col">기도</th><th scope="col">암송</th><th scope="col">합계</th></tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot><tr><td class="l">합계</td><td class="num" id="fW"></td><td class="num" id="fQ"></td><td class="num" id="fP"></td><td class="num" id="fR"></td><td class="sum num" id="fS"></td></tr></tfoot>
      </table>
    </div>
  </section>
</main>

<script>
  // 예시: 2027-01-01 ~ 01-05 (오늘 1/5). 말씀 · 퀴즈 · 기도 · 암송 점수 — 합계 24점(미션 홈과 같음)
  const DAYS = { 1: [2, 1, 2, 1], 2: [2, 1, 2, 0], 3: [2, 1, 2, 1], 4: [2, 0, 2, 0], 5: [2, 0, 1, 0] };
  const ALL = { 1: 1, 2: 1, 3: 1 }, TODAY = 5, WD = ['일', '월', '화', '수', '목', '금', '토'];
  const $ = (id) => document.getElementById(id);
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2000); }

  // 월 탭(1월만 기록, 이후 달은 아직)
  $('tabs').innerHTML = Array.from({ length: 12 }, (_, i) => `<button type="button" class="num" aria-pressed="${i === 0}" ${i === 0 ? '' : 'disabled'}>${i + 1}</button>`).join('');

  // 달력: 2027-01-01 은 금요일 → 앞 5칸은 12월
  const cells = [];
  for (let i = 0; i < 42; i++) {
    let d = i - 4, cls = [];
    if (i < 5) { d = 27 + i; cls.push('o'); } else if (d > 31) { d -= 31; cls.push('o'); }
    const inM = !cls.includes('o');
    if (inM && ALL[d]) cls.push('all');
    if (inM && d === TODAY) cls.push('today');
    if (inM && d > TODAY) cls.push('f');
    const p = inM && DAYS[d] ? sum(DAYS[d]) : '–';
    cells.push(inM && DAYS[d] ? `<a href="#" class="${cls.join(' ')}" data-d="${d}" aria-label="1월 ${d}일 ${p}점"><span class="num">${d}</span><small class="num">${p}</small></a>`
      : `<span class="${cls.join(' ')}"><span class="num">${d}</span><small>${p}</small></span>`);
  }
  $('grid').innerHTML = cells.join('');
  $('grid').addEventListener('click', (e) => { const a = e.target.closest('a[data-d]'); if (!a) return; e.preventDefault(); toast(`1월 ${a.dataset.d}일 미션 홈으로 가요 (시안)`); });

  // 미션별 합계: 1/1 ~ 1/5 기준 최대 = 말씀 2×5, 퀴즈 1×5, 기도 2×5, 암송 주마다 1(2주)
  const names = ['말씀', '퀴즈', '기도', '암송'], max = [10, 5, 10, 2];
  const tot = [0, 1, 2, 3].map((k) => sum(Object.values(DAYS).map((r) => r[k])));
  const did = [0, 1, 2, 3].map((k) => Object.values(DAYS).filter((r) => r[k] > 0).length);
  $('rows').innerHTML = names.map((n, k) => `<div class="mr"><span class="no num">0${k + 1}</span><span class="nm">${n}</span>
    <span class="bw" aria-hidden="true"><i style="width:${Math.round(tot[k] / max[k] * 100)}%"></i></span><span class="v num">${tot[k]}<u>점</u></span>
    <span class="meta num">${k === 3 ? did[k] + '주 수행' : did[k] + '일 수행'} · 최대 ${max[k]}점</span></div>`).join('');

  // 일자별 표(최근 날짜가 위)
  $('tbody').innerHTML = Object.keys(DAYS).map(Number).sort((a, b) => b - a).map((d) => {
    const r = DAYS[d], dow = WD[(d + 4) % 7];
    return `<tr class="${d === TODAY ? 'today' : ''}"><td class="l"><a href="#" data-d="${d}"><b class="num">${d}</b><span>${dow}</span></a></td>${r.map((v) => `<td class="num${v ? '' : ' z'}">${v || '–'}</td>`).join('')}<td class="sum num">${sum(r)}</td></tr>`;
  }).join('');
  ['fW', 'fQ', 'fP', 'fR'].forEach((id, k) => $(id).textContent = tot[k]);
  $('fS').textContent = sum(tot);
  $('tbody').addEventListener('click', (e) => { const a = e.target.closest('a[data-d]'); if (!a) return; e.preventDefault(); toast(`1월 ${a.dataset.d}일 미션 홈으로 가요 (시안)`); });

  function show(which) {
    const m = which === 'M';
    $('tM').setAttribute('aria-selected', m); $('tD').setAttribute('aria-selected', !m);
    $('pM').hidden = !m; $('pD').hidden = m;
  }
  $('tM').onclick = () => show('M');
  $('tD').onclick = () => show('D');
  show(location.hash === '#daily' ? 'D' : 'M');
</script>
