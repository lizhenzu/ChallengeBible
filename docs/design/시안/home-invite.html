<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>홈 초대 배너 시안</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#EEF1F5}
body{width:360px;padding:14px 0 18px;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#1B1F24;font-size:14px;line-height:1.5}
.lb{display:flex;justify-content:space-between;align-items:baseline;margin:18px 20px 8px;font-size:15px;font-weight:800}
.lb:first-child{margin-top:0}
.lb span{font-size:12px;font-weight:700;color:#5B6470}
.sky{background:linear-gradient(180deg,#CFE6FB 0,#E8F3FD 150px,#F6F8FB 260px);padding:12px 14px 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:0 2px 12px}
.top small{display:block;font-size:11px;color:#46627F}
.top b{font-size:15px;font-weight:900;color:#17324D}
.top em{font-style:normal;font-size:12px;color:#46627F}
.inv{display:block;padding:15px 15px 14px;border-radius:18px;background:linear-gradient(135deg,#FFB938,#F08A24);color:#3A2200;box-shadow:0 6px 16px rgba(240,138,36,.35)}
.inv .h{display:flex;align-items:center;gap:11px}
.inv .ic{flex:none;width:48px;height:48px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.inv .t{font-size:18px;font-weight:900;line-height:1.3}
.inv .d{margin-top:1px;font-size:13px;font-weight:700;color:#5A3700;word-break:keep-all}
.inv .go{display:block;margin-top:12px;height:44px;border-radius:12px;background:#fff;color:#B85A00;font-size:15px;font-weight:900;text-align:center;line-height:44px}
.card{margin-top:12px;padding:15px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #E6EAF0}
.card small{font-size:12px;color:#7B8490}
.card h3{margin:0;font-size:22px;font-weight:900}
.card h3 u{text-decoration:none;font-size:14px;font-weight:700}
.card p{margin:4px 0 0;font-size:13px;color:#5B6470}
.card em{font-style:normal;font-weight:800;color:#F08A24}
.ghost{height:64px;margin-top:12px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px #E6EAF0;opacity:.55}
.ph{background:#fff;padding:14px 20px 18px}
.cal{height:40px;border-radius:10px;background:repeating-linear-gradient(90deg,#F3F5F8 0 44px,#fff 44px 48px);margin-bottom:10px}
.ent{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#EEF4FE}
.ent .ic{flex:none;width:44px;height:44px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:23px}
.ent .m{flex:1;min-width:0}
.ent .t{font-size:15px;font-weight:800;color:#2B59C3}
.ent .d{font-size:12.5px;color:#5B6470}
.ent .ar{color:#98A1AD;font-size:18px}
.note{margin:8px 0 0;font-size:12.5px;color:#7B8490;word-break:keep-all}
</style></head><body>
<div class="lb"><div>① 부서 홈 (로그인하면 처음 보는 화면)</div></div>
<div class="sky">
 <div class="top"><div><small>대한예수교장로회</small><b>잠실새내교회</b></div><em>11월 7일 토요일</em></div>
 <div class="card"><small>안녕하세요</small><h3>정서윤 <u>님</u></h3><p><em>유년부</em>에 오심을 환영해요</p></div>
 <a class="inv" style="margin-top:12px">
  <div class="h"><span class="ic">💌</span><div><div class="t">가족팀 초대가 왔어요!</div><div class="d">김민호님이 웃음폭탄네로 초대했어요</div></div></div>
  <span class="go">초대 확인하기 ›</span>
 </a>
 <div class="ghost"></div>
</div>
<div class="lb"><div>② 미션 홈 맨 아래</div><span>초대 카드를 뺌</span></div>
<div class="ph"><div class="cal"></div>
 <div class="ent"><span class="ic">👨‍👩‍👧</span><div class="m"><div class="t">우리 가족팀 만들기</div><div class="d">가족이 함께 모은 점수로 축하받아요</div></div><span class="ar">›</span></div>
 <p class="note">초대가 있어도 지금까지의 입구(만들기 · 신청 중)만 보여요.</p>
</div>
</body></html>
