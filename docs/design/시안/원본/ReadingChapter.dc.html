<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 장 본문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="ReadingChapters.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="font-size: 18px; font-weight: 700">창세기 24장</span>
    </div>
    <button aria-label="글자 크기" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDE1E6; background: #FFFFFF; font-size: 15px; font-weight: 700; color: #1B1F24">가</button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 16px; overflow: hidden">
    <div role="tablist" aria-label="번역" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E9ECF0">
      <button role="tab" aria-selected="true" style="min-height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #1B1F24">개역개정</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 500; color: #5B6470">현대인의성경</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 500; color: #5B6470">NIV</button>
    </div>

    <section style="flex: 1; background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
      <sc-for list="{{verses}}" as="v" hint-placeholder-count="3">
        <p style="margin: 0; font-size: 16px; line-height: 1.8"><span style="font-size: 13px; font-weight: 700; color: {{accent}}; margin-right: 6px">{{v.no}}</span>{{v.text}}</p>
      </sc-for>
      <p style="margin: 0; font-size: 14px; color: #5B6470">… 67절까지 이어집니다</p>
    </section>

    <button style="min-height: 58px; border-radius: 16px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      이 장 읽었어요
    </button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="ReadingChapter.dc.html" style="min-height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE1E6; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">이전 장 (23장)</a>
      <a href="ReadingChapter.dc.html" style="min-height: 48px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE1E6; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">다음 장 (25장)</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const verses = [
      { no: 1, text: '아브라함이 나이가 많아 늙었고 여호와께서 그에게 범사에 복을 주셨더라' },
      { no: 2, text: '아브라함이 자기 집 모든 소유를 맡은 늙은 종에게 이르되 청하건대 네 손을 내 허벅지 밑에 넣으라' },
      { no: 3, text: '내가 너에게 하늘의 하나님, 땅의 하나님이신 여호와를 가리켜 맹세하게 하노니 너는 내가 거주하는 이 지방 가나안 족속의 딸 중에서 내 아들을 위하여 아내를 택하지 말고' }
    ];
    return { accent: this.props.accent ?? '#2B59C3', verses: verses };
  }
}
</script>
</body>
</html>
