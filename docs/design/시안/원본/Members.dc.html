<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소속 관리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 8px">
    <span style="font-size: 22px; font-weight: 700">소속 관리</span>
    <label style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE1E6">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">이름 또는 아이디 찾기</span>
      <input type="search" placeholder="이름 또는 아이디" style="flex: 1; border: 0; font-size: 15px; outline: none; background: transparent">
    </label>
    <div role="tablist" style="display: flex; gap: 8px">
      <button role="tab" aria-selected="true" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">신청 3</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DDE1E6; background: #FFFFFF; color: #1B1F24; font-size: 14px">승인 46</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DDE1E6; background: #FFFFFF; color: #1B1F24; font-size: 14px">정지 0</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DDE1E6; background: #FFFFFF; color: #1B1F24; font-size: 14px">진급 1</button>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 6px 20px 16px; overflow: hidden">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 2px solid {{accent}}">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 16px; font-weight: 700">최기쁨 <span style="font-size: 13px; font-weight: 400; color: #5B6470">gippeum</span></span>
        <span style="font-size: 12px; color: #5B6470">1/4 신청 · 참여자 희망</span>
      </div>
      <fieldset style="border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <legend style="font-size: 13px; color: #5B6470; padding: 0; margin-bottom: 6px">역할 (여러 개 가능)</legend>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: {{accent}}">참여자</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: {{accent}}">보호자</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: {{accent}}">교사</label>
        <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px; accent-color: {{accent}}">관리자</label>
      </fieldset>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="group-label" style="font-size: 13px; color: #5B6470">그룹 라벨 (선택)</label>
        <input id="group-label" type="text" value="2학년 1반" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CED5; font-size: 15px">
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; min-height: 48px; border-radius: 12px; border: 1px solid #DDE1E6; background: #FFFFFF; color: #1B1F24; font-size: 15px; font-weight: 700">거절</button>
        <button style="flex: 2; min-height: 48px; border-radius: 12px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700">승인</button>
      </div>
    </section>

    <sc-for list="{{pending}}" as="p" hint-placeholder-count="2">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 56px; box-sizing: border-box">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 700">{{p.name}} <span style="font-size: 13px; font-weight: 400; color: #5B6470">{{p.id}}</span></span>
          <span style="font-size: 12px; color: #5B6470">{{p.info}}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </sc-for>
  </main>

  <nav aria-label="관리 메뉴" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E6EA; padding: 6px 8px 18px">
    <a href="AdminHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6470">현황</a>
    <a href="Members.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{accent}}">소속</a>
    <a href="AdminHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6470">콘텐츠</a>
    <a href="AdminHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6470">설정</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pending = [
      { name: '김엄마', id: 'mom.kim', info: '1/5 신청 · 보호자 희망' },
      { name: '한사랑', id: 'sarang', info: '1/5 신청 · 참여자 희망' }
    ];
    return { accent: this.props.accent ?? '#2B59C3', pending: pending };
  }
}
</script>
</body>
</html>
