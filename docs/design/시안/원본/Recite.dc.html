<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>암송</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 700">이번 주 암송</span>
      <span style="font-size: 13px; color: #5B6470">1월 3일(주일) ~ 1월 9일(토)</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 20px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #EEF3EF; color: #1F5C45; font-size: 14px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5C45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      이번 주 암송은 이미 완료했어요 (1월 3일)
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 13px; font-weight: 700; color: {{accent}}">요한복음 3:16</div>
      <sc-if value="{{showVerse}}" hint-placeholder-val="{{true}}">
        <p style="margin: 0; font-size: 20px; line-height: 1.8; font-weight: 500">하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라</p>
      </sc-if>
      <sc-if value="{{hideVerse}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; font-size: 20px; line-height: 1.8; font-weight: 500; color: #5B6470">하나님이 세상을 ○○○ ○○○○ 독생자를 ○○○○ 이는 그를 ○○ ○○○ 멸망하지 않고 ○○○ ○○○ 하려 하심이라</p>
      </sc-if>
      <button onClick="{{toggle}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #DDE1E6; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #1B1F24">{{toggleLabel}}</button>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; color: #5B6470">공과</div>
      <div style="font-size: 15px; font-weight: 700">[공과 제목]</div>
    </section>

    <button disabled style="margin-top: auto; min-height: 58px; border-radius: 16px; border: 2px solid {{accent}}; background: #FFFFFF; color: #1B1F24; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
      <span style="width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      </span>
      외웠어요
    </button>
    <div style="text-align: center; font-size: 13px; color: #5B6470">한 주에 한 번 +1점</div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hidden: false };
  }
  renderVals() {
    const hidden = this.state.hidden;
    return {
      accent: this.props.accent ?? '#2B59C3',
      showVerse: !hidden,
      hideVerse: hidden,
      toggleLabel: hidden ? '구절 다시 보기' : '가리고 외워 보기',
      toggle: () => this.setState({ hidden: !hidden })
    };
  }
}
</script>
</body>
</html>
