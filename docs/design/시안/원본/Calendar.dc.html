<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>달력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 18px; font-weight: 700">달력</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 20px; overflow: hidden">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button aria-label="이전 달" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 17px; font-weight: 700">2027년 1월</span>
        <button aria-label="다음 달" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{dows}}" as="w" hint-placeholder-count="7">
          <div style="text-align: center; font-size: 12px; font-weight: 700; color: {{w.color}}; padding: 4px 0">{{w.label}}</div>
        </sc-for>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
          <button style="height: 58px; border-radius: 10px; border: 2px solid {{c.border}}; background: {{c.bg}}; padding: 4px 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; color: {{c.color}}">
            <span style="font-size: 13px; font-weight: 500">{{c.day}}</span>
            <span style="font-size: 12px; font-weight: 700; color: {{c.scoreColor}}">{{c.score}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 16px; padding: 4px 6px 0; font-size: 12px; color: #5B6470">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{accent}}"></span>완주한 날</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; border: 2px solid #1B1F24; box-sizing: border-box"></span>오늘</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 15px; font-weight: 700">1월 5일 (오늘)</span>
        <span style="font-size: 15px; font-weight: 700; color: {{accent}}">3점</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{today}}" as="t" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; border-radius: 10px; background: #F5F6F8">
            <span style="font-size: 12px; color: #5B6470">{{t.name}}</span>
            <span style="font-size: 15px; font-weight: 700">{{t.value}}</span>
          </div>
        </sc-for>
      </div>
      <a href="Main.dc.html" style="min-height: 48px; border-radius: 12px; background: #F1F4FA; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: {{accent}}">이 날짜 미션 하러 가기</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const dows = ['일', '월', '화', '수', '목', '금', '토'].map(function (l, i) {
      return { label: l, color: i === 0 ? '#B2462E' : '#5B6470' };
    });
    const scores = { 1: 6, 2: 5, 3: 6, 4: 4, 5: 3 };
    const done = { 1: true, 2: true, 3: true };
    const cells = [];
    // 2027-01: 1일은 금요일. 일요일 시작 42칸 = 12/27 ~ 2/6 (R-70)
    for (let i = 0; i < 42; i++) {
      let day, other;
      if (i < 5) { day = 27 + i; other = true; }
      else if (i < 36) { day = i - 4; other = false; }
      else { day = i - 35; other = true; }
      const isToday = !other && day === 5;
      const isDone = !other && !!done[day];
      const hasScore = !other && scores[day] !== undefined;
      cells.push({
        day: day,
        score: hasScore ? String(scores[day]) : '',
        bg: isDone ? accent : '#FFFFFF',
        border: isToday ? '#1B1F24' : (isDone ? accent : '#FFFFFF'),
        color: isDone ? '#FFFFFF' : (other ? '#6E7682' : '#1B1F24'),
        scoreColor: isDone ? '#FFFFFF' : accent
      });
    }
    const today = [
      { name: '말씀', value: '2점' },
      { name: '기도', value: '1점' },
      { name: '퀴즈', value: '도전 중' },
      { name: '암송', value: '주 완료' }
    ];
    return { accent: accent, dows: dows, cells: cells, today: today };
  }
}
</script>
</body>
</html>
