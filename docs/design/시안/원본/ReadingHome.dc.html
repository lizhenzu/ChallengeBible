<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 대시보드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column">

  <header style="background: #F5F6F8; padding: 14px 20px 22px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="ReadingMenu.dc.html" aria-label="목차 열기" style="width: 42px; height: 40px; border: 1px solid #DDE1E6; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </a>
      <span style="flex: 1; font-size: 15px; font-weight: 500">대시보드</span>
      <span style="font-size: 13px; color: #5B6470">1월 5일 화요일</span>
    </div>
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{accent}}">나의 성경 통독 · 1독째</span>
    <div style="display: flex; align-items: center; gap: 18px">
      <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="전체 진도 1.9%">
        <circle cx="48" cy="48" r="42" fill="none" stroke="#E3E6EA" stroke-width="5"></circle>
        <circle cx="48" cy="48" r="42" fill="none" stroke="{{accent}}" stroke-width="5" stroke-dasharray="5 263.9" transform="rotate(-90 48 48)"></circle>
        <text x="48" y="55" text-anchor="middle" font-size="21" font-weight="300" fill="#1B1F24">1.9%</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 24px; font-weight: 300">23 / 1,189장</span>
        <span style="font-size: 13px; color: #5B6470; line-height: 1.7">구약 23 / 929장<br>신약 0 / 260장</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #1B1F24; border-bottom: 1px solid #DDE1E6">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="3">
        <div style="padding: 12px 0; text-align: center; border-left: {{c.rule}}; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 24px; font-weight: 300">{{c.v}}</span><span style="font-size: 12px; color: #5B6470">{{c.k}}</span>
        </div>
      </sc-for>
    </div>
  </header>

  <a href="ReadingChapter.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 20px; background: {{accent}}; color: #FFFFFF">
    <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #FFFFFF">이어 읽기</span>
      <span style="font-size: 21px; font-weight: 500; color: #FFFFFF">창세기 24장</span>
      <span style="font-size: 14px; line-height: 1.7; color: #FFFFFF">"아브라함이 나이가 많아 늙었고 여호와께서 그에게 범사에 복을 주셨더라"</span>
      <span style="font-size: 12px; color: #FFFFFF">1절부터 보던 중 · 오늘 07:42</span>
    </span>
    <span style="font-size: 30px; font-weight: 300; color: #FFFFFF" aria-hidden="true">→</span>
  </a>

  <section style="display: flex; flex-direction: column; gap: 10px; padding: 24px 20px 0">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: {{accent}}">다음에 읽을 곳</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{next}}" as="n" hint-placeholder-count="6">
        <a href="ReadingChapter.dc.html" style="display: flex; justify-content: space-between; align-items: baseline; padding: 11px 10px; border: 1px solid #E3E6EA; border-radius: 8px; font-size: 14px">{{n.book}}<span style="font-size: 12px; color: {{accent}}; font-weight: 700">{{n.ch}}</span></a>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px; padding: 26px 20px 0">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: {{accent}}">통독 진도</span>
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{b.name}}</span><span style="color: #5B6470">{{b.txt}}</span></div>
        <div style="height: 4px; background: #E3E6EA"><div style="height: 4px; width: {{b.w}}; min-width: {{b.min}}; background: {{b.color}}"></div></div>
      </div>
    </sc-for>
  </section>

  <section style="display: flex; flex-direction: column; gap: 8px; padding: 26px 20px 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: {{accent}}">최근 8주</span>
      <span style="font-size: 12px; color: #5B6470">1/5 오늘</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{dows}}" as="w" hint-placeholder-count="7">
        <span style="text-align: center; font-size: 11px; color: #5B6470">{{w}}</span>
      </sc-for>
      <sc-for list="{{heat}}" as="h" hint-placeholder-count="56">
        <span title="{{h.title}}" style="height: 34px; background: {{h.bg}}; color: {{h.color}}; border: 2px solid {{h.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px">{{h.day}}</span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: #5B6470">적음
      <span style="width: 12px; height: 12px; background: #E9ECF0"></span><span style="width: 12px; height: 12px; background: #C9D6F2"></span><span style="width: 12px; height: 12px; background: #8DA7E3"></span><span style="width: 12px; height: 12px; background: {{accent}}"></span>많음</div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px; padding: 26px 20px 28px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: {{accent}}">책별 진도</span>
      <a href="ReadingBooks.dc.html" style="font-size: 12px; color: #5B6470">구약 목록 →</a>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <button role="tab" aria-selected="true" style="min-height: 38px; border: 1px solid #1B1F24; background: #1B1F24; color: #FFFFFF; font-size: 13px">구약 39권</button>
      <button role="tab" aria-selected="false" style="min-height: 38px; border: 1px solid #DDE1E6; border-left: 0; background: #FFFFFF; color: #1B1F24; font-size: 13px">신약 27권</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{books}}" as="k" hint-placeholder-count="16">
        <a href="ReadingBooks.dc.html" style="position: relative; overflow: hidden; padding: 7px 6px 9px; border: 1px solid #E3E6EA; font-size: 12px; white-space: nowrap">{{k.name}}<span style="display: block; font-size: 11px; color: {{k.sub}}">{{k.prog}}</span><span style="position: absolute; left: 0; bottom: 0; height: 3px; width: {{k.w}}; background: {{accent}}"></span></a>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #5B6470; text-align: center">… 나머지 23권</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const cells = [['5', '일 연속'], ['5', '일 읽음'], ['5장', '오늘 읽은 장']].map(function (c, i) { return { v: c[0], k: c[1], rule: i ? '1px solid #DDE1E6' : '0' }; });
    const next = [['창세기', '24장'], ['출애굽기', '1장'], ['레위기', '1장'], ['민수기', '1장'], ['마태복음', '1장'], ['시편', '1편']].map(function (n) { return { book: n[0], ch: n[1] }; });
    const bars = [
      { name: '전체', txt: '23 / 1,189 · 1.9%', w: '1.9%', min: '6px', color: '#1B1F24' },
      { name: '구약', txt: '23 / 929 · 2.5%', w: '2.5%', min: '6px', color: accent },
      { name: '신약', txt: '0 / 260 · 0.0%', w: '0%', min: '0px', color: accent }
    ];
    const dows = ['일', '월', '화', '수', '목', '금', '토'];
    const read = { '1/1': 3, '1/2': 4, '1/3': 6, '1/4': 5, '1/5': 5 };
    const heat = [];
    const start = new Date(2026, 10, 15);
    for (let i = 0; i < 56; i++) {
      const d = new Date(start.getTime() + i * 86400000);
      const key = (d.getMonth() + 1) + '/' + d.getDate();
      const n = read[key] || 0;
      const future = d > new Date(2027, 0, 5);
      const bg = future ? '#FFFFFF' : (n === 0 ? '#E9ECF0' : n <= 3 ? '#C9D6F2' : n <= 5 ? '#8DA7E3' : accent);
      heat.push({ day: d.getDate(), title: key + ' — ' + n + '장', bg: bg, color: n > 5 ? '#FFFFFF' : (n > 0 ? '#1B1F24' : '#5B6470'), ring: key === '1/5' ? '#1B1F24' : bg });
    }
    const raw = [['창세기', 23, 50], ['출애굽기', 0, 40], ['레위기', 0, 27], ['민수기', 0, 36], ['신명기', 0, 34], ['여호수아', 0, 24], ['사사기', 0, 21], ['룻기', 0, 4], ['사무엘상', 0, 31], ['사무엘하', 0, 24], ['열왕기상', 0, 22], ['열왕기하', 0, 25], ['역대상', 0, 29], ['역대하', 0, 36], ['에스라', 0, 10], ['느헤미야', 0, 13]];
    const books = raw.map(function (r) { return { name: r[0], prog: r[1] + '/' + r[2], w: Math.round(r[1] / r[2] * 100) + '%', sub: r[1] > 0 ? accent : '#5B6470' }; });
    return { accent: accent, cells: cells, next: next, bars: bars, dows: dows, heat: heat, books: books };
  }
}
</script>
</body>
</html>
