<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 진도 현황</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 2px; padding: 20px 20px 8px">
    <span style="font-size: 13px; color: #5B6470">관리 · 잠실새내교회 장년부</span>
    <span style="font-size: 22px; font-weight: 700">통독 진도 현황</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 16px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <section style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B6470">참여</span>
        <span style="font-size: 20px; font-weight: 700">38명</span>
      </section>
      <section style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B6470">이번 주 읽음</span>
        <span style="font-size: 20px; font-weight: 700">27명</span>
      </section>
      <section style="background: #FFFFFF; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B6470">평균 진도</span>
        <span style="font-size: 20px; font-weight: 700">1.6%</span>
      </section>
    </div>

    <div style="display: flex; gap: 8px">
      <button style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 700">진도율 순</button>
      <button style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DDE1E6; background: #FFFFFF; color: #1B1F24; font-size: 14px">최근 읽은 순</button>
      <button style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DDE1E6; background: #FFFFFF; color: #1B1F24; font-size: 14px">이름 순</button>
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 11px 0; border-bottom: 1px solid #F0F2F4">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 15px; font-weight: 700">{{p.name}} <span style="font-size: 12px; font-weight: 400; color: #5B6470">{{p.rounds}}</span></span>
            <span style="font-size: 15px; font-weight: 700; color: {{accent}}">{{p.pct}}</span>
          </div>
          <span style="height: 6px; border-radius: 3px; background: #E9ECF0; overflow: hidden; display: block">
            <span style="display: block; height: 6px; width: {{p.bar}}; background: {{accent}}"></span>
          </span>
          <span style="font-size: 12px; color: #5B6470">마지막 읽은 날 {{p.last}}</span>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A5C","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['박신실', '1독째', 6.1, '오늘'],
      ['최온유', '1독째', 4.7, '오늘'],
      ['이은혜', '1독째', 3.9, '오늘'],
      ['김화평', '1독째', 2.6, '어제'],
      ['정소망', '1독째', 1.9, '1/3'],
      ['한기쁨', '1독째', 0.8, '1/2'],
      ['오인내', '1독째', 0.0, '읽은 기록 없음']
    ];
    const people = raw.map(function (r) {
      return { name: r[0], rounds: r[1], pct: r[2].toFixed(1) + '%', bar: (r[2] > 0 ? Math.max(r[2], 1.5) : 0) + '%', last: r[3] };
    });
    return { accent: this.props.accent ?? '#1F7A5C', people: people };
  }
}
</script>
</body>
</html>
