<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>말씀</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 700">오늘의 말씀</span>
      <span style="font-size: 13px; color: #5B6470">1월 5일 화요일</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px; overflow: hidden">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; font-weight: 700; color: {{accent}}">창세기 1:1–5</div>
      <div style="font-size: 18px; font-weight: 700; line-height: 1.45">하나님이 빛을 만드셨어요</div>
      <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #1B1F24">아무것도 없던 때에 하나님이 말씀으로 세상을 지으셨어요. 첫째 날, 하나님은 "빛이 있으라" 하시고 빛과 어둠을 나누셨어요.</p>
      <a href="Word.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-radius: 12px; background: #F1F4FA; font-size: 15px; font-weight: 700; color: {{accent}}">
        본문 읽기 (5절)
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 700">생각해 봐요</div>
      <div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.6"><span style="font-weight: 700; color: {{accent}}">1</span><span>하나님은 무엇으로 세상을 만드셨나요?</span></div>
      <div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.6"><span style="font-weight: 700; color: {{accent}}">2</span><span>오늘 내 마음에 비춰 주셨으면 하는 빛은 무엇인가요?</span></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
      <div style="font-size: 14px; color: #5B6470">한 것을 눌러 주세요</div>
      <button disabled style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 18px; border-radius: 16px; border: 2px solid {{accent}}; background: #FFFFFF; font-size: 16px; font-weight: 700; color: #1B1F24">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
          내가 읽었어요
        </span>
        <span style="font-size: 14px; color: #5B6470">완료</span>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 18px; border-radius: 16px; border: 0; background: {{accent}}; font-size: 16px; font-weight: 700; color: #FFFFFF">
        부모님께 읽어드렸어요
        <span style="font-size: 14px">+1점</span>
      </button>
    </section>
  </main>

  <div role="status" style="position: absolute; left: 20px; right: 20px; top: 80px; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #1B1F24; color: #FFFFFF; font-size: 15px">
    <span style="font-weight: 700">+1점!</span>
    <span>올해 총 24점</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2B59C3' };
  }
}
</script>
</body>
</html>
