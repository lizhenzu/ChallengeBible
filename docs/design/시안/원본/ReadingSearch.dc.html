<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 성경 검색</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px">
    <a href="ReadingMenu.dc.html" aria-label="목차 열기" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE1E6; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </a>
    <span style="font-size: 18px; font-weight: 700">성경 검색</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 16px; overflow: hidden">
    <form role="search" style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 2px solid {{accent}}; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">검색어</span>
        <input type="search" value="사랑" placeholder="단어나 구절 — 사랑, 믿음, 은혜…" style="flex: 1; min-width: 0; border: 0; outline: none; font-size: 16px; background: transparent">
      </label>
      <button type="submit" style="min-height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700">검색</button>
    </form>

    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
        <a href="ReadingSearch.dc.html" style="min-height: 34px; padding: 0 12px; border-radius: 17px; background: #FFFFFF; border: 1px solid #DDE1E6; display: flex; align-items: center; font-size: 13px">{{c}}</a>
      </sc-for>
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px">
        <span style="font-size: 15px; font-weight: 700">"사랑" 검색 결과</span>
        <span style="font-size: 12px; color: #5B6470">개역개정 · 앞부분만 표시</span>
      </div>
      <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
        <a href="ReadingChapter.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid #F0F2F4">
          <span style="font-size: 12px; font-weight: 700; color: {{accent}}">{{r.ref}}</span>
          <span style="font-size: 14px; line-height: 1.7">{{r.text}}</span>
        </a>
      </sc-for>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px">
        <span style="font-size: 15px; font-weight: 700">인기 검색어</span>
        <span style="font-size: 12px; color: #5B6470">이 부서 · 최근 30일</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px">
        <sc-for list="{{rank}}" as="k" hint-placeholder-count="6">
          <a href="ReadingSearch.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px">
            <span style="width: 18px; font-weight: 700; color: {{k.color}}">{{k.no}}</span>
            <span style="flex: 1">{{k.word}}</span>
            <span style="font-size: 11px; color: #5B6470">{{k.n}}</span>
          </a>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const chips = ['사랑', '믿음', '구원', '은혜', '기도', '평안', '소망', '감사'];
    const results = [
      { ref: '요한복음 3:16', text: '하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라' },
      { ref: '요한일서 4:8', text: '사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라' },
      { ref: '고린도전서 13:4', text: '사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며' }
    ];
    const rank = [['사랑', '217회'], ['구원', '216회'], ['여호와', '65회'], ['전도', '35회'], ['감사', '28회'], ['하나님', '23회']].map(function (r, i) {
      return { no: i + 1, word: r[0], n: r[1], color: i < 3 ? accent : '#5B6470' };
    });
    return { accent: accent, chips: chips, results: results, rank: rank };
  }
}
</script>
</body>
</html>
