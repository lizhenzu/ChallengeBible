<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리 홈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 2px; padding: 20px 20px 8px">
    <span style="font-size: 13px; color: #5B6470">관리 · 잠실새내교회 유년부</span>
    <span style="font-size: 22px; font-weight: 700">1월 5일 화요일</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 16px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Members.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #5B6470">승인 기다림</span>
        <span style="font-size: 24px; font-weight: 700; color: {{accent}}">3명</span>
      </a>
      <a href="Members.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #5B6470">받은 진급 요청</span>
        <span style="font-size: 24px; font-weight: 700">1건</span>
      </a>
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 14px; color: #5B6470">오늘 참여</span>
        <span style="font-size: 13px; color: #5B6470">참여자 42명</span>
      </div>
      <div style="font-size: 30px; font-weight: 700">18명 <span style="font-size: 16px; color: #5B6470; font-weight: 500">43%</span></div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 84px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <div style="font-size: 11px; color: #5B6470">{{d.n}}</div>
            <div style="width: 100%; border-radius: 4px; background: {{d.color}}; height: {{d.h}}"></div>
            <div style="font-size: 11px; color: #5B6470">{{d.label}}</div>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px">
        <span style="font-size: 15px; font-weight: 700">사흘째 참여 없음</span>
        <span style="font-size: 13px; color: #5B6470">5명</span>
      </div>
      <sc-for list="{{absent}}" as="a" hint-placeholder-count="3">
        <a href="MemberDetail.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-top: 1px solid #F0F2F4">
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 500">{{a.name}}</span>
            <span style="font-size: 12px; color: #5B6470">{{a.group}}</span>
          </span>
          <span style="font-size: 13px; color: #5B6470">마지막 {{a.last}}</span>
        </a>
      </sc-for>
    </section>
  </main>

  <nav aria-label="관리 메뉴" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E3E6EA; padding: 6px 8px 18px">
    <a href="AdminHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{accent}}">현황</a>
    <a href="Members.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6470">소속</a>
    <a href="AdminHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6470">콘텐츠</a>
    <a href="AdminHome.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6470">설정</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const data = [['12/30', 0], ['12/31', 0], ['1/1', 25], ['1/2', 21], ['1/3', 34], ['1/4', 20], ['오늘', 18]];
    const week = data.map(function (d) {
      return { label: d[0], n: d[1], h: Math.max(3, Math.round(d[1] / 42 * 56)) + 'px', color: d[1] > 0 ? accent : '#E3E6EA' };
    });
    const absent = [
      { name: '이하늘', group: '3학년 1반', last: '1/2' },
      { name: '박소망', group: '2학년 2반', last: '1/1' },
      { name: '정믿음', group: '그룹 없음', last: '참여 없음' }
    ];
    return { accent: accent, week: week, absent: absent };
  }
}
</script>
</body>
</html>
