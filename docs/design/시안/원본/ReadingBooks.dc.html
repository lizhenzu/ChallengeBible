<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 구약 읽기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #F5F6F8; padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="ReadingMenu.dc.html" aria-label="목차 열기" style="width: 42px; height: 40px; border: 1px solid #DDE1E6; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </a>
      <span style="font-size: 15px; font-weight: 500">구약 읽기</span>
    </div>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <a href="ReadingBooks.dc.html" role="tab" aria-selected="true" style="min-height: 40px; border: 1px solid #1B1F24; background: #1B1F24; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px">구약</a>
      <a href="ReadingBooks.dc.html" role="tab" aria-selected="false" style="min-height: 40px; border: 1px solid #DDE1E6; border-left: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px">신약</a>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; color: {{accent}}">구약 전체</span><span style="font-size: 34px; font-weight: 300">2.5<span style="font-size: 16px; color: #5B6470">%</span></span></span>
      <span style="font-size: 13px; color: #5B6470; text-align: right; line-height: 1.6">23장 읽음<br>929장 중 · 39권</span>
    </div>
    <div style="height: 3px; background: #E3E6EA"><div style="width: 2.5%; height: 3px; background: {{accent}}"></div></div>
  </header>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 18px 20px 0">
    <button aria-expanded="true" style="position: relative; overflow: hidden; padding: 10px 10px 12px; border: 1px solid {{accent}}; background: #E8EEFA; text-align: left; font-size: 14px; font-weight: 700; color: #1B1F24">창세기<span style="display: block; font-size: 12px; color: {{accent}}">23/50</span><span style="position: absolute; left: 0; bottom: 0; height: 3px; width: 46%; background: {{accent}}"></span></button>
    <button style="padding: 10px 10px 12px; border: 1px solid #E3E6EA; background: #FFFFFF; text-align: left; font-size: 14px; color: #1B1F24">출애굽기<span style="display: block; font-size: 12px; color: #5B6470">0/40</span></button>
    <button style="padding: 10px 10px 12px; border: 1px solid #E3E6EA; background: #FFFFFF; text-align: left; font-size: 14px; color: #1B1F24">레위기<span style="display: block; font-size: 12px; color: #5B6470">0/27</span></button>
  </div>

  <section style="margin-top: 12px; padding: 16px 20px; background: #F5F6F8; border-top: 1px solid #E3E6EA; border-bottom: 1px solid #E3E6EA; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 17px; font-weight: 500">창세기</span>
      <span style="font-size: 13px; color: #5B6470">23 / 50장 · 46%</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{chs}}" as="c" hint-placeholder-count="50">
        <a href="ReadingChapter.dc.html" aria-label="{{c.label}}" style="height: 30px; border-radius: 15px; background: {{c.bg}}; color: {{c.color}}; border: 2px solid {{c.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{c.no}}</a>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #5B6470">장 번호를 길게 누르면 종이 성경으로 읽은 장을 바로 완료로 표시할 수 있어요.</span>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; min-height: 46px; border: 1px solid #DDE1E6; border-radius: 10px; background: #FFFFFF; font-size: 14px; color: #1B1F24">닫기</button>
      <a href="ReadingChapter.dc.html" style="flex: 2; min-height: 46px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">이어 읽기 24장 →</a>
    </div>
  </section>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 12px 20px 0">
    <sc-for list="{{books}}" as="b" hint-placeholder-count="6">
      <button style="padding: 10px 10px 12px; border: 1px solid #E3E6EA; background: #FFFFFF; text-align: left; font-size: 14px; color: #1B1F24">{{b.name}}<span style="display: block; font-size: 12px; color: #5B6470">{{b.prog}}</span></button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const chs = [];
    for (let i = 1; i <= 50; i++) {
      const read = i <= 23, next = i === 24;
      chs.push({ no: i, label: i + '장 ' + (read ? '완료' : '안 읽음'), bg: read ? '#E8EEFA' : '#FFFFFF', color: read ? accent : (next ? '#1B1F24' : '#5B6470'), ring: next ? accent : (read ? '#E8EEFA' : '#E3E6EA') });
    }
    const books = [['민수기', '0/36'], ['신명기', '0/34'], ['여호수아', '0/24'], ['사사기', '0/21'], ['룻기', '0/4'], ['사무엘상', '0/31']].map(function (b) { return { name: b[0], prog: b[1] }; });
    return { accent: accent, chs: chs, books: books };
  }
}
</script>
</body>
</html>
