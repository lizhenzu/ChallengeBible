<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 책 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 8px 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="ReadingHome.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="font-size: 18px; font-weight: 700">책 목록</span>
    </div>
    <div role="tablist" aria-label="구약 신약" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; margin-left: 8px; border-radius: 12px; background: #E9ECF0">
      <button role="tab" aria-selected="true" style="min-height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #1B1F24">구약 39권</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 500; color: #5B6470">신약 27권</button>
    </div>
  </header>

  <main style="flex: 1; padding: 6px 20px 16px; overflow: hidden">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{books}}" as="b" hint-placeholder-count="10">
        <a href="ReadingChapters.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 11px 0; border-bottom: 1px solid #F0F2F4">
          <span style="display: flex; justify-content: space-between; align-items: baseline">
            <span style="font-size: 15px; font-weight: {{b.weight}}">{{b.name}}</span>
            <span style="font-size: 13px; color: {{b.countColor}}">{{b.read}} / {{b.total}}장</span>
          </span>
          <span style="height: 6px; border-radius: 3px; background: #E9ECF0; overflow: hidden; display: block">
            <span style="display: block; height: 6px; width: {{b.pct}}; background: {{accent}}"></span>
          </span>
        </a>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B59C3';
    const raw = [['창세기', 23, 50], ['출애굽기', 0, 40], ['레위기', 0, 27], ['민수기', 0, 36], ['신명기', 0, 34], ['여호수아', 0, 24], ['사사기', 0, 21], ['룻기', 0, 4], ['사무엘상', 0, 31], ['사무엘하', 0, 24], ['열왕기상', 0, 22]];
    const books = raw.map(function (r) {
      return {
        name: r[0], read: r[1], total: r[2],
        pct: Math.round(r[1] / r[2] * 100) + '%',
        weight: r[1] > 0 ? 700 : 500,
        countColor: r[1] > 0 ? accent : '#5B6470'
      };
    });
    return { accent: accent, books: books };
  }
}
</script>
</body>
</html>
