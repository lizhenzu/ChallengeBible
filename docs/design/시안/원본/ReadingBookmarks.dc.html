<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 북마크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px">
    <a href="ReadingMenu.dc.html" aria-label="목차 열기" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE1E6; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </a>
    <span style="flex: 1; font-size: 18px; font-weight: 700">북마크</span>
    <span style="font-size: 13px; color: #5B6470">마음에 담은 말씀 3</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 6px 20px 16px; overflow: hidden">
    <sc-for list="{{marks}}" as="m" hint-placeholder-count="3">
      <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 13px; font-weight: 700; color: {{accent}}">{{m.ref}}</span>
          <button aria-label="북마크 해제" style="width: 36px; height: 36px; border: 0; background: none; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#E0A100" stroke="#E0A100" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
          </button>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.8">{{m.text}}</p>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 12px; color: #5B6470">{{m.when}}</span>
          <a href="ReadingChapter.dc.html" style="font-size: 13px; font-weight: 700; color: {{accent}}">이 장 읽기 →</a>
        </div>
      </section>
    </sc-for>

    <section style="margin-top: auto; border-radius: 16px; border: 2px dashed #DDE1E6; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <span style="font-size: 14px; font-weight: 700">말씀을 더 담아 보세요</span>
      <span style="font-size: 13px; color: #5B6470; line-height: 1.6">성경을 읽다가 절 끝의 ★ 을 누르면<br>여기에 모아 둘게요</span>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const marks = [
      { ref: '창세기 24:2', text: '아브라함이 자기 집 모든 소유를 맡은 늙은 종에게 이르되 청하건대 네 손을 내 허벅지 밑에 넣으라', when: '오늘 담음' },
      { ref: '창세기 12:2', text: '내가 너로 큰 민족을 이루고 너에게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라', when: '1/3 담음' },
      { ref: '창세기 1:1', text: '태초에 하나님이 천지를 창조하시니라', when: '1/1 담음' }
    ];
    return { accent: this.props.accent ?? '#2B59C3', marks: marks };
  }
}
</script>
</body>
</html>
