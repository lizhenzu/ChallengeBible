<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통독 북마크</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #F5F6F8; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="ReadingMenu.dc.html" aria-label="목차 열기" style="width: 42px; height: 40px; border: 1px solid #DDE1E6; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </a>
      <span style="font-size: 15px; font-weight: 500">북마크</span>
    </div>
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{accent}}">마음에 담은 말씀</span>
    <span style="font-size: 30px; font-weight: 300">3<span style="font-size: 16px; color: #5B6470"> 구절</span></span>
  </header>

  <div style="padding: 0 20px">
    <sc-for list="{{marks}}" as="m" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 18px 0; border-bottom: 1px solid #E3E6EA">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 13px; font-weight: 700; color: {{accent}}">{{m.ref}}</span>
          <span style="font-size: 12px; color: #5B6470">{{m.when}}</span>
        </div>
        <p style="margin: 0; font-size: 16px; line-height: 1.9; word-break: keep-all">{{m.text}}<span style="display: inline-flex; gap: 6px; vertical-align: middle; margin-left: 6px">
          <button aria-label="북마크 해제" aria-pressed="true" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #EEF0F3; color: #E0A100; display: inline-flex; align-items: center; justify-content: center">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
          </button>
        </span></p>
        <a href="ReadingChapter.dc.html" style="align-self: flex-start; font-size: 13px; color: #5B6470">이 장 읽기 →</a>
      </div>
    </sc-for>
  </div>
  <p style="margin: 18px 20px 0; font-size: 13px; color: #5B6470; line-height: 1.7">성경을 읽다가 절 끝의 ★ 을 누르면 여기에 모아 둘게요.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const marks = [
      { ref: '창세기 24:2', text: '아브라함이 자기 집 모든 소유를 맡은 늙은 종에게 이르되 청하건대 네 손을 내 허벅지 밑에 넣으라', when: '오늘' },
      { ref: '창세기 12:2', text: '내가 너로 큰 민족을 이루고 너에게 복을 주어 네 이름을 창대하게 하리니 너는 복이 될지라', when: '1/3' },
      { ref: '창세기 1:1', text: '태초에 하나님이 천지를 창조하시니라', when: '1/1' }
    ];
    return { accent: this.props.accent ?? '#2B59C3', marks: marks };
  }
}
</script>
</body>
</html>
