<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B59C3;text-decoration:none}a:hover{color:#1E4296}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; padding: 96px 28px 32px; gap: 40px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"></path><path d="M4 19V5M12 7v6M9 10h6"></path></svg>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">도전 성경말씀</h1>
    <p style="margin: 0; font-size: 15px; color: #5B6470">매일 말씀 · 기도 · 퀴즈 · 암송</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="login-id" style="font-size: 14px; font-weight: 700">아이디</label>
      <input id="login-id" type="text" autocomplete="username" value="cheolsu" style="min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CED5; font-size: 16px; color: #1B1F24">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="login-pw" style="font-size: 14px; font-weight: 700">비밀번호</label>
      <input id="login-pw" type="password" autocomplete="current-password" value="12345678" style="min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid #C9CED5; font-size: 16px; color: #1B1F24">
    </div>
    <button type="submit" style="min-height: 54px; border-radius: 14px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; margin-top: 8px">로그인</button>
  </form>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: auto">
    <a href="Join.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700; color: {{accent}}">처음이에요 · 가입하기</a>
    <p style="margin: 0; font-size: 13px; color: #5B6470; text-align: center; line-height: 1.6">비밀번호를 잊었으면<br>부서 선생님께 말해 주세요.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2B59C3' };
  }
}
</script>
</body>
</html>
