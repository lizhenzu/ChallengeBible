<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 점수</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
th,td{padding:12px 4px;text-align:center;font-size:14px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 18px; font-weight: 700">내 점수</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 20px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #5B6470">2027 시즌</span>
        <span style="font-size: 24px; font-weight: 700; color: {{accent}}">24점</span>
      </section>
      <section style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #5B6470">연속 참여</span>
        <span style="font-size: 24px; font-weight: 700">5일</span>
      </section>
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 8px 12px 12px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button aria-label="이전 달" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 16px; font-weight: 700">2027년 1월</span>
        <button aria-label="다음 달" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>
      <table style="width: 100%; border-collapse: collapse">
        <thead>
          <tr style="border-bottom: 1px solid #E3E6EA; color: #5B6470">
            <th scope="col" style="font-weight: 500; text-align: left; padding-left: 8px">날짜</th>
            <th scope="col" style="font-weight: 500">말씀</th>
            <th scope="col" style="font-weight: 500">기도</th>
            <th scope="col" style="font-weight: 500">퀴즈</th>
            <th scope="col" style="font-weight: 500">암송</th>
            <th scope="col" style="font-weight: 700; color: #1B1F24">합계</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <tr style="border-bottom: 1px solid #F0F2F4">
              <th scope="row" style="font-weight: 500; text-align: left; padding-left: 8px">{{r.date}}</th>
              <td>{{r.w}}</td>
              <td>{{r.p}}</td>
              <td>{{r.q}}</td>
              <td>{{r.r}}</td>
              <td style="font-weight: 700; color: {{accent}}">{{r.t}}</td>
            </tr>
          </sc-for>
        </tbody>
        <tfoot>
          <tr>
            <th scope="row" style="font-weight: 700; text-align: left; padding-left: 8px">1월</th>
            <td style="font-weight: 700">10</td>
            <td style="font-weight: 700">9</td>
            <td style="font-weight: 700">3</td>
            <td style="font-weight: 700">2</td>
            <td style="font-weight: 700; color: {{accent}}">24</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['1/5 화', 2, 1, 0, 0],
      ['1/4 월', 2, 2, 0, 0],
      ['1/3 일', 2, 2, 1, 1],
      ['1/2 토', 2, 2, 1, 0],
      ['1/1 금', 2, 2, 1, 1]
    ].map(function (r) {
      return { date: r[0], w: r[1], p: r[2], q: r[3], r: r[4], t: r[1] + r[2] + r[3] + r[4] };
    });
    return { accent: this.props.accent ?? '#2B59C3', rows: rows };
  }
}
</script>
</body>
</html>
