<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B1F24;text-decoration:none}a:hover{color:#1B1F24}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B1F24; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 700">오늘의 기도</span>
      <span style="font-size: 13px; color: #5B6470">1월 5일 화요일</span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 20px; overflow: hidden">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 18px; font-weight: 700">빛을 주신 하나님께</div>
      <p style="margin: 0; font-size: 15px; line-height: 1.75; font-weight: 700">사랑의 하나님,</p>
      <p style="margin: 0; font-size: 15px; line-height: 1.75">어두운 세상에 빛을 주셔서 감사해요. 오늘 하루 제 마음과 말이 밝은 빛처럼 친구들과 가족을 비추게 해 주세요.</p>
      <p style="margin: 0; font-size: 15px; line-height: 1.75; font-weight: 700">예수님 이름으로 기도합니다. 아멘.</p>
      <div style="font-size: 13px; color: {{accent}}; font-weight: 700">근거 말씀 · 창세기 1:3</div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
      <div style="font-size: 14px; color: #5B6470">누구를 위해 기도했나요?</div>
      <button disabled style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 18px; border-radius: 16px; border: 2px solid {{accent}}; background: #FFFFFF; font-size: 16px; font-weight: 700; color: #1B1F24">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
          나를 위해
        </span>
        <span style="font-size: 14px; color: #5B6470">완료</span>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 18px; border-radius: 16px; border: 0; background: {{accent}}; font-size: 16px; font-weight: 700; color: #FFFFFF">
        부모님을 위해
        <span style="font-size: 14px">+1점</span>
      </button>
      <button style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 18px; border-radius: 16px; border: 1px solid #DDE1E6; background: #FFFFFF; font-size: 16px; font-weight: 700; color: #1B1F24">
        친구를 위해
        <span style="font-size: 13px; font-weight: 500; color: #5B6470">점수 없음</span>
      </button>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2B59C3","options":["#2B59C3","#1F7A5C","#B2462E","#6A4BB5"],"section":"부서 대표 색"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2B59C3' };
  }
}
</script>
</body>
</html>
