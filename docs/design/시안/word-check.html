<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>말씀 입력 점검 시안</title>
<style>
:root{--bg:#fff;--soft:#F5F6F8;--fg:#1B1F24;--dim:#5B6470;--rule:#E3E6EA;--line:#C9CED5;--accent:#2B59C3;--accent-bg:#EAF0FB;--on-accent:#fff;--ok:#16A34A;--ok-bg:#EAF7EF;--warn:#9A5B00;--warn-bg:#FFF4DE;
 --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
body{padding:0}
.cap{font-size:12px;color:var(--dim);background:var(--soft);padding:6px 16px;border-block:1px solid var(--rule)}
.pg{padding:14px 16px 24px;max-width:430px;margin:auto}
h1{font-size:20px;line-height:1.3}
.sub{font-size:13px;color:var(--dim);margin-top:2px}
.bar{display:flex;align-items:center;gap:6px;margin-top:12px}
.bar a,.bar .pick{height:40px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--fg);text-decoration:none;background:var(--bg)}
.bar a{width:40px;font-size:18px}
.bar .pick{flex:1;font-weight:700;font-size:15px;gap:6px}
.bar .pick small{font-weight:400;color:var(--dim);font-size:12px}
.done{font-size:14px;margin-top:10px}.done b{color:var(--ok);font-size:16px}
.wc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wc button{font:inherit;font-size:13px;min-height:34px;padding:4px 10px;border-radius:999px;border:1px solid transparent}
.wc .z{background:var(--ok-bg);color:var(--ok)}
.wc .n{background:var(--warn-bg);color:var(--warn);border-color:#E9C98F}
.wc .g{background:var(--soft);color:var(--dim);border-color:var(--line)}
.wc .on{background:var(--warn);color:#fff;border-color:var(--warn)}
.dw,.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dw{margin-top:14px;font-size:12px;color:var(--dim);text-align:center}
.gr{margin-top:4px}
.dc{min-height:50px;border-radius:8px;border:1px solid transparent;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}
.dc.all{background:var(--ok-bg)}
.dc.some{background:var(--warn-bg)}
.dc.none{background:var(--soft);color:var(--dim)}
.dc.dr{border:1.5px dashed var(--warn)}
.dc.sun .no{text-decoration:underline}
.dc.sel{outline:2px solid var(--accent);outline-offset:0}
.dc.dim{opacity:.28}
.dots{display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:#3F4750;border:1px solid #3F4750}
.dots i.o{background:transparent}
.dc.none .dots i{background:transparent;border-color:#AEB5BE}
.lg{font-size:12px;color:var(--dim);margin-top:10px;display:grid;gap:4px}
.lg div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lg span{display:inline-flex;gap:4px;align-items:center}
.lg u{width:12px;height:12px;border-radius:3px;display:inline-block;text-decoration:none}
.lg .dots{display:inline-flex}
.dt{margin-top:14px;border:1px solid var(--rule);border-radius:12px;padding:14px}
.dt h2{font-size:16px}.dt .ref{font-size:13px;color:var(--dim)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);margin-left:4px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.st div{font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px}
.st .y{background:var(--ok-bg);color:var(--ok)}.st .x{background:var(--warn-bg);color:var(--warn)}
.fl{margin-top:12px;font-size:14px}.fl b{display:block;font-size:12px;color:var(--dim);font-weight:600}
.fl p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:13px;color:var(--dim)}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:14px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none}
.em{font-size:14px;margin-top:8px}
</style></head><body>
<div id="s1"><div class="cap">① 처음 화면: 이번 달, 오늘이 열림 (플랫폼 관리자 · 모바일 360px)</div><div class="pg" id="p1"></div></div>
<div id="s2"><div class="cap">② "영상 구간 없음"을 누르고, 말씀이 없는 날을 고른 모습</div><div class="pg" id="p2"></div></div>
<script>
const miss={3:['영상 구간'],4:['영상 구간'],7:['영상 구간'],9:['오늘 이야기','영상 구간'],11:['영상 구간'],14:['제목'],15:['성경 범위'],17:['영상 구간']};
const draft=[12,18,19], lastRow=19, ITEMS=['성경 범위','제목','오늘 이야기','영상 구간'];
const DAYS=[...Array(30)].map((_,i)=>{const d=i+1;return{d,row:d<=lastRow,miss:d<=lastRow?(miss[d]||[]):[],draft:draft.includes(d)}});
const WK='일월화수목금토';
const wk=d=>WK[(d-1)%7];
function page(sel,filter){
  const full=DAYS.filter(x=>x.row&&!x.miss.length&&!x.draft).length;
  const cnt=k=>DAYS.filter(x=>x.miss.includes(k)).length;
  const chip=(k,n,cls)=>`<button class="${cls}">${k} ${n}</button>`;
  let h=`<h1>말씀 입력 점검</h1><p class="sub">공용 말씀에 빠진 곳이 있는 날을 찾아요</p>
  <div class="bar"><a aria-label="이전 달">‹</a><div class="pick">2026년 11월 <small>▾</small></div><a aria-label="다음 달">›</a></div>
  <p class="done">30일 중 <b>${full}일</b> 완성</p><div class="wc">`;
  h+=chip('말씀 없음',DAYS.filter(x=>!x.row).length,'g');
  h+=chip('초안',draft.length,'n');
  for(const k of ITEMS){const n=cnt(k);const on=filter===k;h+=chip(k+' 없음',n,on?'on':n?'n':'z');}
  h+=`</div><div class="dw">${[...WK].map(c=>`<span>${c}</span>`).join('')}</div><div class="gr">`;
  for(const x of DAYS){
    const cls=!x.row?'none':(x.miss.length?'some':(x.draft?'some':'all'));
    const off=filter&&!x.miss.includes(filter);
    const dots=ITEMS.map(k=>`<i class="${!x.row||x.miss.includes(k)?'o':''}"></i>`).join('');
    h+=`<div class="dc ${cls}${x.draft?' dr':''}${(x.d-1)%7==0?' sun':''}${x.d==sel?' sel':''}${off?' dim':''}"><span class="no">${x.d}</span><span class="dots">${dots}</span></div>`;
  }
  h+=`</div><div class="lg">
  <div><span><u style="background:var(--ok-bg);border:1px solid var(--ok)"></u>모두 채움</span><span><u style="background:var(--warn-bg);border:1px solid var(--warn)"></u>빠진 곳 있음</span><span><u style="background:var(--soft);border:1px solid var(--line)"></u>말씀 없음</span><span><u style="border:1.5px dashed var(--warn)"></u>초안</span></div>
  <div><span><span class="dots"><i></i></span>입력</span><span><span class="dots"><i class="o"></i></span>없음</span><span>점 순서: 범위 · 제목 · 이야기 · 영상</span></div></div>`;
  const x=DAYS[sel-1];
  h+=`<section class="dt"><h2>11월 ${x.d}일 ${wk(x.d)}요일</h2>`;
  if(!x.row){
    h+=`<p class="em">이 날은 아직 말씀이 없어요</p><p class="note">이대로 두면 아이들 화면에 "오늘은 없음"으로 보여요.</p><a class="btn">말씀 입력하기</a>`;
  }else{
    h+=`<p class="ref">창세기 24:1 ~ 25:18 <span class="tag ok">공개</span></p><div class="st">`+ITEMS.map(k=>x.miss.includes(k)?`<div class="x">✕ ${k}</div>`:`<div class="y">✓ ${k}</div>`).join('')+`</div>
    <div class="fl"><b>제목</b>이삭의 아내를 찾는 기도</div>
    <div class="fl"><b>오늘 이야기</b><p>아브라함은 믿을 수 있는 종에게 이삭의 아내를 찾아 달라고 부탁했어요. 종은 먼 길을 가서 우물가에서 하나님께 기도했어요.</p></div>
    <div class="fl"><b>해설</b><p class="note">종의 기도와 하나님의 응답을 함께 살펴봐요.</p></div>
    <div class="fl"><b>영상 구간<span class="tag">없음</span></b><p class="note">24장 · 25장 기본 듣기 영상을 처음부터 끝까지 재생해요</p></div>
    <a class="btn">말씀 수정</a>`;
  }
  return h+`</section>`;
}
document.getElementById('p1').innerHTML=page(7,null);
document.getElementById('p2').innerHTML=page(22,'영상 구간');
</script></body></html>
