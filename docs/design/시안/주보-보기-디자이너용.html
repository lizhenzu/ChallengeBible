<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>주보게시판 · 도전!!!성경말씀 (디자이너용 순수 HTML)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap">
<!--
  ■ 디자이너 안내
  - 이 파일 하나로 열립니다(CSS 는 아래 <style> 안, 스크립트 없음). 주보 이미지는 전체 주소라 어디서 열어도 보입니다.
  - 실제 화면: https://bit2001-001-site2.ctempurl.com/jamsil-kids/bulletin  (휴대폰 폭 360~430px 기준, PC 는 가운데 760px)
  - 고칠 때: 맨 위 :root 의 색 · 글자 값, 그 아래 [1] 머리줄 [2] 환영 문구 [3] 주보 목록(날짜 줄 · 종이 액자) [4] 맨 아래 바.
  - 구조 이름: header.top(머리줄) · section.jb-wel(환영) · article.jb-cur(주보 한 주) · figure.jb-img(사진 한 장 = 종이 한 장) · div.jb-end(맨 아래 바)
  - 로그인한 교사 · 관리자에게는 머리줄 오른쪽이 「+ 주보 작성」, 각 주보 아래에 「고치기 · 지우기」가 더 보입니다(아래 [옵션] 주석 참고).
  - 주보 사진은 글씨가 있어서 자르지 않고 원본 비율 그대로 폭에 맞춥니다. PDF 주보는 「PDF 파일 줄」로 나옵니다(아래 [옵션]).
-->
<style>
/* ───────── 색 · 글자 (여기만 바꿔도 전체가 바뀝니다) ───────── */
:root {
  --bg: #FFFFFF;          /* 화면 바탕 */
  --paper-bg: #EEF0F4;    /* 주보 목록 뒤 연한 회색 바탕 */
  --soft: #F5F6F8;
  --fg: #1B1F24;          /* 본문 글자 */
  --dim: #5B6470;         /* 보조 글자 */
  --rule: #E3E6EA;        /* 얇은 줄 */
  --line: #C9CED5;
  --accent: #2B59C3;      /* 파랑(강조) */
  --on-accent: #FFFFFF;
  --paper-line: #CFD5DE;  /* 종이 테두리 */
  --gut: 20px;            /* 화면 좌우 여백 */
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; letter-spacing: -.01em; word-break: keep-all; -webkit-text-size-adjust: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.gut { padding-left: var(--gut); padding-right: var(--gut); }

/* ───────── [1] 머리줄: 왼쪽 「홈 › 주보게시판」 · 오른쪽 사람 아이콘(로그인) ───────── */
.top .wrap { max-width: 760px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--rule); }
.pb-l { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; }
.pb-r { display: flex; align-items: center; gap: 8px; flex: none; }
.par { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; font-size: 14px; font-weight: 800; color: var(--accent); }
.sep { color: #6e6e75; margin: 0 4px; font-size: 13px; }
.cur { font-size: 15px; font-weight: 800; color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
.pb-login { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); }
.pb-act { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 800; white-space: nowrap; } /* [옵션] 교사 · 관리자용 「+ 주보 작성」 */

/* ───────── [2] 환영 문구 ───────── */
.jb-in { max-width: 760px; margin-inline: auto; padding-inline: var(--gut); }
.jb-wel { padding-block: 16px 14px; }
.jb-wel .kick { font-size: 12px; font-weight: 800; color: var(--accent); }
.jb-wel h1 { margin: 4px 0 6px; font-size: 22px; line-height: 1.3; font-weight: 900; letter-spacing: -.02em; }
.jb-wel p { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--dim); }

/* ───────── [3] 주보 목록: 날짜 줄 + 종이 한 장씩(최근 주보가 위, 아래로 계속) ───────── */
.jb-list2 { background: var(--paper-bg); padding-block: 6px 14px; }
.jb-cur { display: block; padding: 0 0 8px; }
.jb-date { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 14px 8px; }
.jb-date b { font-size: 15px; font-weight: 900; }
.jb-date small { font-size: 12px; color: var(--dim); }
.jb-badge { margin-left: 6px; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; vertical-align: 1px; } /* 「이번 주」 표시(맨 위 한 주만) */
.jb-gal { display: flex; flex-direction: column; gap: 18px; padding-block: 4px 12px; }
.jb-img { position: relative; margin: 0; background: #fff; border-radius: 8px; border: 1px solid var(--paper-line); box-shadow: 0 1px 0 #fff inset, 0 2px 4px rgba(20,30,50,.08), 0 14px 24px -12px rgba(20,30,50,.35); } /* 떠 있는 종이: 테두리 + 그림자 한 겹 */
.jb-img img { display: block; width: 100%; height: auto; border-radius: 7px; }
.jb-img i { position: absolute; right: 10px; bottom: 8px; font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 99px; } /* 「1 / 2」 순서 표시(한 주에 사진이 여러 장일 때만) */
.jb-pdf { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; background: #fff; font-size: 14px; font-weight: 700; min-width: 0; } /* [옵션] PDF 주보 줄 */
.jb-pdf em { font-style: normal; font-size: 12px; font-weight: 800; color: #fff; background: #D92D20; border-radius: 6px; padding: 2px 6px; flex: none; }
.jb-pdf span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jb-pdf small { margin-left: auto; color: var(--dim); font-weight: 600; flex: none; }
.jb-edit { display: flex; gap: 6px; justify-content: flex-end; padding-block: 10px; } /* [옵션] 교사 · 관리자용 고치기 · 지우기 */

/* ───────── [4] 맨 아래 바(따라다니지 않고 맨 끝에 한 번) ───────── */
.jb-btn { min-height: 44px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.jb-btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.jb-end { background: var(--bg); border-top: 1px solid var(--rule); padding-block: 14px 18px; }
.jb-end .jb-in { display: flex; gap: 8px; }
.jb-end .jb-btn { flex: 1; }
</style>
</head>
<body>

<!-- [1] 머리줄 -->
<header class="top gut">
  <div class="wrap">
    <span class="pb-l">
      <a class="par" href="https://bit2001-001-site2.ctempurl.com/jamsil-kids">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
      <span class="sep" aria-hidden="true">›</span>
      <b class="cur">주보게시판</b>
    </span>
    <span class="pb-r">
      <!-- 손님: 사람 아이콘(로그인) -->
      <a class="pb-login" href="https://bit2001-001-site2.ctempurl.com/account/login" aria-label="로그인">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </a>
      <!-- [옵션] 교사 · 관리자는 위 아이콘 대신:  <a class="pb-act" href="https://bit2001-001-site2.ctempurl.com/jamsil-kids/bulletin/edit">+ 주보 작성</a> -->
    </span>
  </div>
</header>

<main>
  <!-- [2] 환영 문구 -->
  <section class="jb-wel jb-in">
    <div class="kick">잠실새내교회 유년부</div>
    <h1>주보게시판에<br />오신 것을 환영합니다</h1>
    <p>이번 주 예배 순서와 교회 소식이 담긴 주보예요. 아래로 내리며 한눈에 보세요.</p>
  </section>

  <!-- [3] 주보 목록 (주보 한 주 = article 하나, 사진 한 장 = figure 하나) -->
  <div class="jb-list2">

    <article class="jb-cur">
      <div class="jb-date jb-in">
        <b>2026년 11월 29일 주일 <span class="jb-badge">이번 주</span></b>
        <small>사진 2장</small>
      </div>
      <div class="jb-gal jb-in">
        <figure class="jb-img">
          <img src="https://bit2001-001-site2.ctempurl.com/jamsil-kids/bulletin/file/4" alt="2026년 11월 29일 주보 1쪽" />
          <i>1 / 2</i>
        </figure>
        <figure class="jb-img">
          <img src="https://bit2001-001-site2.ctempurl.com/jamsil-kids/bulletin/file/5" alt="2026년 11월 29일 주보 2쪽" />
          <i>2 / 2</i>
        </figure>
      </div>
      <!-- [옵션] PDF 가 있는 주보:
      <div class="jb-in"><a class="jb-pdf" href="https://bit2001-001-site2.ctempurl.com/jamsil-kids/bulletin/file/번호" target="_blank" rel="noopener"><em>PDF</em><span>교회주보.pdf</span><small>1.2MB</small></a></div> -->
      <!-- [옵션] 교사 · 관리자:
      <div class="jb-edit jb-in"><a class="jb-btn" href="#">고치기</a><button type="button" class="jb-btn">지우기</button></div> -->
    </article>

    <article class="jb-cur">
      <div class="jb-date jb-in">
        <b>2026년 11월 22일 주일</b>
        <small>사진 1장</small>
      </div>
      <div class="jb-gal jb-in">
        <figure class="jb-img">
          <img src="https://bit2001-001-site2.ctempurl.com/jamsil-kids/bulletin/file/3" alt="2026년 11월 22일 주보" />
        </figure>
      </div>
    </article>

  </div>

  <!-- [4] 맨 아래 바 -->
  <div class="jb-end">
    <div class="jb-in">
      <a class="jb-btn" href="https://bit2001-001-site2.ctempurl.com/jamsil-kids">홈으로</a>
      <a class="jb-btn p" href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ 맨 위로</a>
    </div>
  </div>
</main>

</body>
</html>
