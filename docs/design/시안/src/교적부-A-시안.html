<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>교적부 A 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--dim:#6B7280;--mute:#9CA3AF;--line:#EEF0F3;--soft:#F4F6F9;--blue:#2B5BC6;--bl:#EAF0FC;--org:#B4531F}
*{box-sizing:border-box}body{margin:0;padding:28px 24px 36px;background:#E8ECF3;font-family:'Noto Sans KR',sans-serif;color:var(--ink)}
.row{display:flex;gap:28px;align-items:flex-start}
.lab{margin:0 0 4px;font-size:17px;font-weight:800}.sub{margin:0 0 10px;font-size:13px;color:var(--dim)}
.ph{width:390px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.dk{width:860px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.dk .wr{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px}
.top i{font-style:normal;font-size:18px}.top b{color:var(--blue)}.top .h{margin-left:auto;color:var(--blue);font-weight:700}
.dk .top{padding:14px 50px}
.wr{padding:14px 16px 22px}
h1{margin:0;font-size:22px;font-weight:900}h1 small{font-size:13px;color:var(--mute);margin-left:6px;font-weight:700}
.srch{margin-top:12px;height:44px;border-radius:99px;background:var(--soft);display:flex;align-items:center;padding:0 16px;font-size:14px;color:var(--mute)}
.srch:before{content:'🔍';margin-right:8px;font-size:13px}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.tabs span{padding:7px 13px;border-radius:99px;background:var(--soft);font-size:12.5px;color:var(--dim)}.tabs span.on{background:var(--ink);color:#fff;font-weight:700}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;font-size:14px;font-weight:800}.gh span{font-size:11.5px;font-weight:500;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dk .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.cd{border:1px solid #E3E8F0;border-radius:14px;padding:11px 12px 10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.cd .n{display:flex;justify-content:space-between;align-items:baseline}.cd .n b{font-size:15.5px;font-weight:800}
.cd .n em{font-style:normal;font-size:18px;font-weight:900}.cd .n em small{font-size:11px;color:var(--mute);font-weight:500;margin-left:1px}
.tc{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:0 6px;align-items:center;padding-top:6px;border-top:1px solid var(--line)}
.tc + .tc{border-top:0;padding-top:0}
.tc .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .ph2{grid-column:1;font-size:11.5px;color:var(--dim);white-space:nowrap}
.tc .ic{grid-row:1 / span 2;grid-column:2;width:30px;height:30px;border-radius:50%;background:var(--bl);display:grid;place-items:center}
.tc .ic svg{width:15px;height:15px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tc.nop .ic{background:var(--soft)}.tc.nop .ic svg{stroke:#D1D5DB}.tc.nop .ph2{color:#C4C8CF}
.no{font-size:12px;font-weight:700;color:var(--org);padding-top:6px;border-top:1px solid var(--line)}
.cd.last{background:linear-gradient(180deg,#F5F9FF,#fff);border-color:#D6E2F7}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF8E6;font-size:12.5px;line-height:1.7;color:#7C5A10}.note b{color:#5A3E06}
.hit{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.hit b{flex:1}.hit mark{background:var(--bl);color:var(--blue);border-radius:4px}.hit span{font-size:12.5px;color:var(--dim)}.hit em{font-style:normal;color:#D1D5DB}
</style></head><body>
<script>
const TEL='<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
function T(n,p){return p?`<div class="tc"><span class="nm">${n} 선생님</span><span class="ic">${TEL}</span><span class="ph2">${p}</span></div>`:`<div class="tc nop"><span class="nm">${n} 선생님</span><span class="ic">${TEL}</span><span class="ph2">전화 없음</span></div>`}
function C(name,n,ts,cls){return `<div class="cd ${cls||''}"><div class="n"><b>${name}</b><em>${n}<small>명</small></em></div>${ts.length?ts.map(t=>T(t[0],t[1])).join(''):'<div class="no">담임 미배정</div>'}</div>`}
const G1=[C('1반',6,[['박선생','']]),C('2반',8,[['최선생','010-0000-1001']]),C('3반',7,[['정선생','010-0000-1002']]),C('4반',7,[['한선생','010-0000-1003']])];
const G2=[C('1반',7,[['강선생',''],['윤선생','010-0000-2001']]),C('2반',7,[['김교사','010-0000-2002'],['이교사','010-0000-2003']]),C('3반',6,[['조선생','010-0000-2004']]),C('4반',7,[['임선생','010-0000-2005']])];
function page(desk){return `<div class="top"><i>☰</i><b>도전!!!</b>성경말씀 › <strong>교적부</strong><span class="h">홈으로</span></div>
<div class="wr"><h1>교적부<small>2026 · 학생 109 · 14반</small></h1>
<div class="srch">아이 이름 (전체 반에서 바로 찾기)</div>
<div class="tabs"><span class="on">전체</span><span>1학년</span><span>2학년</span><span>3학년</span><span>새친구</span></div>
<div class="gh">⭐ 마지막으로 본 반<span></span></div>
<div class="grid">${C('2학년 2반',7,[['김교사','010-0000-2002'],['이교사','010-0000-2003']],'last')}${desk?'':''}</div>
<div class="gh">새친구반<span>0명</span></div>
<div class="grid">${C('새친구반',0,[])}</div>
<div class="gh">1학년<span>4반 · 28명</span></div><div class="grid">${G1.join('')}</div>
<div class="gh">2학년<span>4반 · 27명</span></div><div class="grid">${G2.join('')}</div>
${desk?'':`<div class="note"><b>바뀌는 점</b><br>· 학년 탭 · 학년 묶음, 카드 2줄(PC는 3줄)<br>· 카드: <b>반 이름 · 학생 수 · 담임 이름 · 전화번호 · 📞 버튼</b>(누르면 바로 전화)<br>· 담임이 둘이면 두 줄, 전화번호가 없으면 회색 "전화 없음"(버튼 누를 수 없음)<br>· 카드의 빈 곳을 누르면 반 교적으로 이동<br>· 빠짐 · 생일 딱지는 넣지 않음(반 화면 안에서만)<br>· 이름 찾기는 칠 때마다 바로 결과(찾기 버튼 없음)<br>· "1학년 ○반"처럼 시작하지 않는 반은 맨 아래 "기타" 묶음</div>`}
</div>`}
function search(){return `<div class="top"><i>☰</i><b>도전!!!</b>성경말씀 › <strong>교적부</strong><span class="h">홈으로</span></div>
<div class="wr"><h1>교적부<small>2026 · 학생 109 · 14반</small></h1>
<div class="srch" style="color:var(--ink)">하늘</div>
<div class="gh">찾은 아이 3명<span>지우기 ✕</span></div>
<div class="hit"><b>김<mark>하늘</mark></b><span>1학년 2반</span><em>›</em></div>
<div class="hit"><b>이<mark>하늘</mark></b><span>2학년 3반</span><em>›</em></div>
<div class="hit"><b>박<mark>하늘</mark>이</b><span>3학년 1반</span><em>›</em></div>
<div class="note"><b>이름을 치면</b><br>· 반 카드 대신 찾은 아이 목록(칠 때마다 바로)<br>· 누르면 그 반 교적의 그 아이 카드로 이동<br>· 지우면 다시 반 카드</div></div>`}
document.write(`<div class="row">
<div><p class="lab">① 휴대폰 — 처음 화면</p><p class="sub">A안 · 딱지 빼고 담임 전화 버튼</p><div class="ph">${page(false)}</div></div>
<div><p class="lab">② 이름을 쳤을 때</p><p class="sub">반 카드 자리에 찾은 아이</p><div class="ph">${search()}</div></div>
</div>
<div style="margin-top:28px"><p class="lab">③ PC(내용 폭 760px)</p><p class="sub">카드 3줄</p><div class="dk">${page(true)}</div></div>`);
</script>
</body></html>
