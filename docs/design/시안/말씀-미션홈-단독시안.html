  :root {

    --stamp: #5E9277; --band: #FFF6E3; --band-fg: #6B4E16; --band-ring: #C9A25E; --bad: #A3361C; --scrim: rgba(17, 20, 24, .5);

    --word-bg: #1C2433; --word-fg: #A9BDE8; --quiz-bg: #2A2119; --quiz-fg: #E3B58A;
    --pray-bg: #241F2E; --pray-fg: #C3B3E6; --rec-bg: #1B2A22; --rec-fg: #9AD0B2;
    --stamp: #8DBBA2; --band: #2A2314; --band-fg: #F0D49A; --band-ring: #C9A25E; --bad: #F0947C; --scrim: rgba(0, 0, 0, .6); color-scheme: dark } }

    --accent: #7FA2F2; --on-accent: #0E1013; --bar: #4D6BAE; --bar-soft: #283652; --cell: #1F2A3F;
    --word-bg: #1C2433; --word-fg: #A9BDE8; --quiz-bg: #2A2119; --quiz-fg: #E3B58A;

  /* 아래 메뉴(휴대폰) */

  .sheet { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0;

  .opt small { font-size: 13px; font-weight: 500; color: var(--dim); }
  .opt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .opt.on small { color: var(--on-accent); }
  .opt.wrong { border-color: var(--bad); color: var(--bad); background: var(--bg); }
  .opt:disabled { cursor: default; }
  .msg { margin: 14px 0 0; font-size: 14px; color: var(--dim); min-height: 1.6em; }
  .msg.bad { color: var(--bad); }
  .close { width: 100%; margin-top: 14px; min-height: 50px; border-radius: 14px; border: 0; background: var(--soft); font-size: 15px; font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
    background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 700; white-space: nowrap; animation: up .25s ease; }

  @media (min-width: 900px) {
    .cols { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); column-gap: 48px; }

    .scrim { align-items: center; }
    .sheet { border-radius: 24px; }
  }
  @media (max-width: 380px) { .pts .big { font-size: 44px; } .stats b { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<script>
  // ─── 예시 데이터: 2027-01-05(화). 인정 기간 = 오늘 · 어제 · 그제(3 · 4 · 5일) ───
  const TODAY = 5, BASE_TOTAL = 21; // 1/1 ~ 1/4 합계 21점
  const POINT = { wordMe: 1, wordParent: 1, prayMe: 1, prayParent: 1, prayFriend: 0, quiz: 1, recite: 1 };
  const QUIZ = { q: '하나님이 첫째 날에 만드신 것은 무엇일까요?', choices: ['하늘', '빛', '땅과 바다', '해와 달'], answer: 1 };
  // 날짜별 기록. recite 는 그 주에 한 날(1/1: 지난주, 1/3: 이번 주)
  const days = {
    1: { word: { me: 1, parent: 1 }, pray: { me: 1, parent: 1, friend: 0 }, quiz: { tries: [1], ok: 1 }, reciteHere: 1 },
    2: { word: { me: 1, parent: 1 }, pray: { me: 1, parent: 1, friend: 0 }, quiz: { tries: [1], ok: 1 }, reciteHere: 0 },
    3: { word: { me: 1, parent: 1 }, pray: { me: 1, parent: 1, friend: 0 }, quiz: { tries: [1], ok: 1 }, reciteHere: 1 },
    4: { word: { me: 1, parent: 1 }, pray: { me: 1, parent: 1, friend: 0 }, quiz: { tries: [0, 2], ok: 0 }, reciteHere: 0 },
    5: { word: { me: 1, parent: 1 }, pray: { me: 1, parent: 0, friend: 0 }, quiz: { tries: [], ok: 0 }, reciteHere: 0 },
  };
  const weekOf = (d) => (d <= 2 ? 'w1' : 'w2'); // 12/27~1/2, 1/3~1/9
  let sel = TODAY;
  const $ = (id) => document.getElementById(id);

  function dayPts(d) {
    const x = days[d]; if (!x) return 0;
    return x.word.me * POINT.wordMe + x.word.parent * POINT.wordParent + x.pray.me * POINT.prayMe + x.pray.parent * POINT.prayParent
      + (x.quiz.ok ? POINT.quiz : 0) + (x.reciteHere ? POINT.recite : 0);
  }
  const weekRecited = (d) => Object.keys(days).some((k) => weekOf(+k) === weekOf(d) && days[k].reciteHere);
  function status(d) {
    const x = days[d];
    return { word: !!(x.word.me || x.word.parent), quiz: !!x.quiz.ok, pray: !!(x.pray.me || x.pray.parent || x.pray.friend), rec: weekRecited(d) };
  }
  const allDone = (d) => days[d] && Object.values(status(d)).every(Boolean);
  const canAct = (d) => d >= TODAY - 2 && d <= TODAY;
  const total = () => Object.keys(days).reduce((s, k) => s + dayPts(+k), 0);

  function render() {
    const st = status(TODAY), doneN = Object.values(st).filter(Boolean).length;
    $('ringV').setAttribute('stroke-dasharray', (289 * doneN / 4).toFixed(1) + ' 289');
    $('ringT').textContent = doneN + '/4';
    $('total').textContent = total();
    $('todayPts').textContent = '+' + dayPts(TODAY) + '점';

    const wk = [['수', 30, 0, ''], ['목', 31, 0, ''], ...[1, 2, 3, 4, 5].map((d) => [['', '', '', '', '', '금', '토', '일', '월', '화'][d + 4] || '', d, dayPts(d), d === TODAY ? 'today' : allDone(d) ? 'all' : ''])];
    wk[1][0] = '목'; wk[2][0] = '금'; wk[3][0] = '토'; wk[4][0] = '일'; wk[5][0] = '월'; wk[6][0] = '오늘';
    $('bars').innerHTML = wk.map(([, , p, c]) => `<div><em class="num">${p}</em><i class="${c}" style="height:${Math.max(4, p / 6 * 100)}px"></i></div>`).join('');
    $('days').innerHTML = wk.map(([w, d, , c]) => `<span class="${c === 'today' ? 't' : ''}">${w}<b class="num">${d}</b></span>`).join('');
    $('wkSum').textContent = wk.reduce((s, x) => s + x[2], 0) + '점';
    const allDays = [1, 2, 3, 4, 5].filter(allDone).length;
    $('stats').innerHTML = [['이어온 날', '5', '일'], ['이달 수행', '5', '/5'], ['이달 점수', String(total()), '점'], ['네 가지 다 한 날', String(allDays), '일']]
      .map(([k, v, u]) => `<div><small>${k}</small><b class="num">${v}<i>${u}</i></b></div>`).join('');

    // 오늘 상태 띠 / 지난 날짜 보기
    const s = status(sel), left = Object.entries(s).filter(([, v]) => !v).map(([k]) => ({ word: '말씀', quiz: '퀴즈', pray: '기도', rec: '암송' })[k]);
    $('viewing').hidden = sel === TODAY;
    $('viewTxt').textContent = `1월 ${sel}일 미션을 보고 있어요` + (canAct(sel) ? ' · 지금도 할 수 있어요' : ' · 보기만 할 수 있어요');
    const band = $('band');
    if (left.length === 0) {
      band.innerHTML = `<span class="stampB">${sel === TODAY ? '오늘' : sel + '일'}<br>완료</span><strong>${sel === TODAY ? '오늘' : '이날'} 네 가지 모두 했어요</strong><p>+${dayPts(sel)}점${sel === TODAY ? ' · 5일째 이어서 하고 있어요' : ''}</p>`;
    } else {
      band.innerHTML = `<span class="stampB">${left.length}가지<br>남음</span><strong>${left.join(' · ')}${left.length === 1 ? '만' : '이'} 남았어요</strong><p>+${dayPts(sel)}점${canAct(sel) ? '' : ' · 지난 날짜라 이제는 할 수 없어요'}</p>`;
    }

    const x = days[sel];
    const quizLeft = 2 - x.quiz.tries.length;
    const firstLeft = ['word', 'quiz', 'pray', 'rec'].find((k) => !s[k]);
    const card = (k, cls, n, t, sub, pts, done, todo) =>
      `<button type="button" class="m ${cls}${canAct(sel) && k === firstLeft ? ' next' : ''}" data-k="${k}"><span class="n num">${n}</span><span class="t">${t}</span><span class="s">${sub}</span><span class="p">${pts}</span><span class="st">${done ? '<span class="done">완료</span>' : `<span class="todo">${todo}</span>`}</span></button>`;
    $('missions').innerHTML = [
      card('word', 'word', '01', '말씀', '창세기 24장 1~9절<br>믿음의 종의 기도', `+${x.word.me + x.word.parent}점`, s.word, '할 차례'),
      card('quiz', 'quiz', '02', '퀴즈', x.quiz.ok ? '정답을 맞혔어요' : quizLeft > 0 ? `오늘 말씀에서 한 문제<br>${quizLeft}번 도전할 수 있어요` : '2번 모두 틀렸어요', x.quiz.ok ? '+1점' : '정답 +1점', s.quiz, quizLeft > 0 && canAct(sel) ? '할 차례' : '끝남'),
      card('pray', 'pray', '03', '기도', '빛을 주신 하나님께', `+${x.pray.me + x.pray.parent}점`, s.pray, '할 차례'),
      card('rec', 'rec', '04', '암송', '요한복음 3:16<br>' + (s.rec ? '이번 주 완료' : '이번 주 아직'), x.reciteHere ? '+1점' : (s.rec ? '이번 주 +1점 받음' : '+1점'), s.rec, '할 차례'),
    ].join('');

    // 달력
    const cells = [];
    for (let i = 0; i < 42; i++) {
      let d, out = i < 5 || i - 4 > 31;
      d = i < 5 ? 27 + i : (i - 4 > 31 ? i - 35 : i - 4);
      const c = [];
      if (out) c.push('o');
      else {
        if (allDone(d)) c.push('all');
        if (d === TODAY) c.push('today');
        if (d > TODAY) c.push('f');
        if (d === sel) c.push('sel');
      }
      const sc = !out && days[d] ? dayPts(d) : '–';
      cells.push(`<button type="button" class="${c.join(' ')}" ${out ? 'disabled' : `data-d="${d}"`} aria-label="${out ? '' : '1월 ' + d + '일 ' + (days[d] ? sc + '점' : '기록 없음')}"><span class="num">${d}</span><small class="num">${sc}</small></button>`);
    }
    $('grid').innerHTML = cells.join('');
  }

  // ─── 미션 창 ───
  function toast(t) {
    const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
  }
  function earn(p, before) {
    render();
    const all = allDone(TODAY) && !before;
    if (p > 0) toast(`+${p}점! 올해 총 ${total()}점`);
    if (all) { $('band').classList.remove('pop'); void $('band').offsetWidth; $('band').classList.add('pop'); }
  }
  function close() { $('layer').innerHTML = ''; }
  function open(k) {
    const d = sel, x = days[d], act = canAct(d);
    const head = (kk, t) => `<div class="grab"></div><div class="k">${kk} · 1월 ${d}일${d === TODAY ? ' (오늘)' : ''}</div><h3>${t}</h3>`;
    let html = '';
    const item = (key, label, on, pts) => `<button type="button" class="opt${on ? ' on' : ''}" data-i="${key}" ${on || !act ? 'disabled' : ''}>${label}<small>${on ? '완료 ✓' : pts > 0 ? '+' + pts + '점' : '점수 없음'}</small></button>`;
    if (k === 'word') html = head('말씀', '창세기 24장 1~9절') + `<div class="body">아브라함이 나이가 많아 늙었고 여호와께서 그에게 범사에 복을 주셨더라 …<br><a href="#" style="color:var(--accent);font-weight:700">본문 전체 읽기 →</a></div><div class="opts">${item('me', '내가 읽었어요', x.word.me, 1)}${item('parent', '부모님께 읽어드렸어요', x.word.parent, 1)}</div>`;
    if (k === 'pray') html = head('기도', '빛을 주신 하나님께') + `<div class="body">사랑의 하나님, 어두운 세상에 빛을 주셔서 감사해요. 오늘 하루 제 마음과 말이 밝은 빛처럼 친구들과 가족을 비추게 해 주세요. 예수님 이름으로 기도합니다. 아멘.</div><div class="opts">${item('me', '나를 위해', x.pray.me, 1)}${item('parent', '부모님을 위해', x.pray.parent, 1)}${item('friend', '친구를 위해', x.pray.friend, 0)}</div>`;
    if (k === 'rec') html = head('암송', '요한복음 3:16') + `<div class="body">하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라</div><div class="opts"><button type="button" class="opt on" disabled>외웠어요<small>이번 주 완료 (1월 3일) ✓</small></button></div>`;
    if (k === 'quiz') {
      const left = 2 - x.quiz.tries.length, over = x.quiz.ok || left <= 0 || !act;
      html = head('퀴즈', QUIZ.q) + `<div class="opts">${QUIZ.choices.map((c, i) => {
        const tried = x.quiz.tries.includes(i), right = x.quiz.ok && i === QUIZ.answer;
        return `<button type="button" class="opt${right ? ' on' : tried ? ' wrong' : ''}" data-q="${i}" ${over || tried ? 'disabled' : ''}>${i + 1}. ${c}<small>${right ? '정답 ✓' : tried ? '내가 고른 답' : ''}</small></button>`;
      }).join('')}</div><p class="msg" id="qmsg">${x.quiz.ok ? '정답! +1점' : left <= 0 ? '이날은 2번 도전했어요.' : act ? `정답이면 +1점 · ${left}번 도전할 수 있어요` : '지난 날짜라 할 수 없어요.'}</p>`;
    }
    if (!act && k !== 'quiz') html += `<p class="msg">지난 날짜라 보기만 할 수 있어요 (오늘 · 어제 · 그제만 가능).</p>`;
    html += `<button type="button" class="close" id="closeBtn">닫기</button>`;
    $('layer').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${k} 미션">${html}</div></div>`;
    $('closeBtn').focus();
    $('closeBtn').onclick = close;
    $('scrim').onclick = (e) => { if (e.target.id === 'scrim') close(); };
    $('layer').querySelectorAll('[data-i]').forEach((b) => b.onclick = () => {
      const before = allDone(TODAY), grp = k === 'word' ? x.word : x.pray;
      grp[b.dataset.i] = 1;
      const p = k === 'word' ? 1 : (b.dataset.i === 'friend' ? 0 : 1);
      earn(p, before); open(k);
      if (p === 0) toast('기도 완료! (친구 기도는 점수 없음)');
    });
    $('layer').querySelectorAll('[data-q]').forEach((b) => b.onclick = () => {
      const before = allDone(TODAY), i = +b.dataset.q;
      if (i === QUIZ.answer) { x.quiz.ok = 1; x.quiz.tries.push(i); earn(1, before); open('quiz'); }
      else { x.quiz.tries.push(i); render(); open('quiz'); const m = $('qmsg'); m.classList.add('bad');
        m.textContent = x.quiz.tries.length >= 2 ? '오늘은 2번 도전했어요. 내일 새 퀴즈에 도전해요.' : '오답이에요 (1/2) 한 번 더 도전해 보세요.'; }
    });
  }

  $('missions').addEventListener('click', (e) => { const b = e.target.closest('.m'); if (b) open(b.dataset.k); });
  $('grid').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    const d = +b.dataset.d;
    if (!days[d]) { toast(d > TODAY ? '아직 오지 않은 날이에요' : '기록이 없는 날이에요'); return; }
    sel = d; render(); $('missions').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('backToday').onclick = () => { sel = TODAY; render(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  document.querySelectorAll('a[href="#"]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); if (!a.closest('.sheet')) toast('시안에서는 이 메뉴가 열리지 않아요'); }));
  render();
</script>
